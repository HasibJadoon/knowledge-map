function grid(){
 document.getElementById("cN").textContent=WORDS.filter(w=>isN(w.pos)).length;
 document.getElementById("cV").textContent=WORDS.filter(w=>w.pos==="V").length;
 const list=WORDS.filter(w=>FILTER==="N"?isN(w.pos):w.pos==="V");
 document.getElementById("grid").innerHTML=list.map((w)=>{const i=WORDS.indexOf(w);return `
  <div class="wc" onclick="open_(${i})">
    ${w.depth?'<div class="depthdot"></div>':''}<div class="pos">${w.pos}</div>
    <div class="w ar">${w.form}</div>
    <div class="en">${w.en}</div>
    <div class="rootlab">ROOT: <b class="ar">${w.root}</b></div>
    <div class="g">${CORE[w.root]||w.en}</div>
    <div class="ref">39:${w.ayah}</div>
  </div>`}).join("");
}
document.getElementById("tgN").onclick=()=>{FILTER="N";document.getElementById("tgN").classList.remove("off");document.getElementById("tgV").classList.add("off");grid();};
document.getElementById("tgV").onclick=()=>{FILTER="V";document.getElementById("tgV").classList.remove("off");document.getElementById("tgN").classList.add("off");grid();};

function ml(ic,t,src,body){return `<div class="ml"><h3><span class="ic">${ic}</span>${t}<span class="src">${src}</span></h3>${body}</div>`}
function open_(i){
 const w=WORDS[i], d=DEEP[w.root]; const sheet=document.getElementById("sheet");
 const hero = d? d.hero : w.form, tr = d? d.translit : '', gl = d? d.gloss : (CORE[w.root]||w.en);
 const morph = d? d.morph : [w.pos==="V"?"Verb":"Noun", "root "+w.root];
 let h=`<div class="hero"><div class="big ar">${hero}</div><div class="meta">
    <div class="translit">${tr} · <span class="ar">${w.form}</span></div>
    <div class="gloss">${gl}</div>
    <div class="morphline">${morph.map(m=>`<span class="mtag">${m}</span>`).join("")}
      <span class="mtag root ar">جذر ${w.root}</span></div></div>
    <button class="close" onclick="document.getElementById('ov').classList.remove('open')">✕</button></div>
   <div class="rail">${['Definition','Word Sums','Roots','Context','Constellation','Images','Hooks','Idiom','Examples','Gem'].map(x=>`<a href="#">${x}</a>`).join("")}</div>
   <div class="body">`;
 if(!d){
   h+=ml("📖","Definition Memlet","ar_ling_root_vocab.core_sense",`<div style="font-size:15px">${CORE[w.root]||w.en}</div>`);
   h+=ml("🪝","Hooks Memlet","ar_ling_root_vocab.membean_hook",`<div class="hook"><div class="k">sound</div><div>${HOOK[w.root]||'—'}</div></div>`);
   h+=ml("🌱","Root & Derivations","ar_ling_lemmas",`<div class="empty">Core card. Full Memlet depth (senses, ṣarf, constellation, gem, exercises) is built for keystone roots — open <b class="gold ar">خلص</b> or <b class="gold ar">زلف</b> to see the complete view. This root: depth pending.</div>`);
   h+=`</div><div class="foot"><b>Core card</b> · 4 Memlets · rendered from ar_ling_root_vocab</div>`;
   sheet.innerHTML=h; document.getElementById('ov').classList.add('open'); sheet.parentElement.scrollTop=0; return;
 }
 h+=ml("📖","Definition Memlet","ar_ling_senses", d.senses.map(s=>`<div class="sense"><div class="n">${s[0]}</div><div><div class="a ar">${s[1]}</div><div class="e">${s[2]}</div><div class="r">QR ${s[3]}</div></div></div>`).join(""));
 h+=ml("🧩","Word Sums Memlet · ṣarf","form_paradigms + conjugation_templates",`<div class="sarf">`+d.sarf.map(f=>`<div class="fcard"><div class="l ar">${f[0]}</div>`+f[1].map(r=>`<div class="frow"><span>${r[0]}</span><span class="ar">${r[1]}</span></div>`).join("")+`</div>`).join("")+`</div>`);
 h+=ml("🌱","Root & Derivation Family","ar_ling_lemmas",`<div class="fam">`+d.fam.map(x=>`<div class="d"><div class="a ar">${x[0]}</div><div class="t">${x[1]}</div></div>`).join("")+`</div>`);
 h+=ml("🕮","Context Relationship Memlet","qr_word_occurrences ↔ ar_ling_quran_links", d.ctx.map(c=>`<div class="ayah"><div class="t ar">${AY[c[0]]}</div><div class="r">QR ${c[1]}</div></div>`).join("")+`<div class="occ"><span style="font-size:11px;color:var(--dim)">also recurs: </span>`+d.occ.map(o=>`<b>${o}</b>`).join("")+`</div>`);
 h+=ml("✦","Word Constellation Memlet","ar_ling_near_synonym_sets + sense_relations",
   `<div class="star"><div class="l">senses</div>`+d.senses.map(s=>`<span class="tok s ar">${s[1]}</span>`).join("")+`</div>
    <div class="star"><div class="l">near-synonyms</div>`+d.syn.map(s=>`<span class="tok y ar">${s}</span>`).join("")+`</div>
    <div class="star"><div class="l">antonyms</div>`+d.ant.map(s=>`<span class="tok n ar">${s}</span>`).join("")+`</div>
    <div class="srcnote">↳ ${d.synsrc}</div>`);
 h+=ml("🎨","Images / Video Stories Memlet","ar_ling_vocab_illustrations",`<div class="illus">${ILL[d.illus]}<div class="c">${d.illusc}</div></div>`);
 h+=ml("🪝","Hooks Memlet","ar_ling_vocab_memory_hooks", d.hooks.map(k=>`<div class="hook"><div class="k">${k[0]}</div><div>${k[1]}</div></div>`).join(""));
 h+= d.idiom? ml("🔗","Verbal Idiom (Mir)","ar_ling_expressions",`<div class="idiom"><div class="ar" style="font-size:22px">${d.idiom[0]}</div><div style="margin-top:4px">${d.idiom[1]}</div><div class="srcnote">↳ ${d.idiom[2]}</div></div>`)
            : ml("🔗","Verbal Idiom (Mir)","ar_ling_expressions",`<div class="empty">No distinct verbal idiom for this root in the passage.</div>`);
 h+=ml("📜","Lexical Scholarship · gem","ar_ling_root_scholarship",`<div class="gem ar">${d.gem}</div><div class="srcnote" style="direction:ltr">↳ ${d.gemsrc}</div>`);
 h+=ml("✎","Examples · Retrieval Memlet","ar_ling_vocab_exercises", d.ex.map(e=>`<div class="ex"><div class="k">${e[0]}</div><div class="q ar" style="direction:ltr">${e[1]}</div>`+e[2].map((o,oi)=>`<div class="opt ${oi===e[3]?'r':''} ar" style="direction:rtl">${o}</div>`).join("")+`</div>`).join(""));
 h+=ml("🗝️","Sinai Key-Term Memlet","src_sinai_2023_keyterms",`<div class="empty">Source registered, entries not yet ingested — shown empty rather than fabricated.</div>`);
 h+=`</div><div class="foot"><b>★ Full depth</b> · 9 Memlets + gem · SRS lives separately at <b>/srs</b> (this view has no review state)</div>`;
 sheet.innerHTML=h; document.getElementById('ov').classList.add('open'); sheet.parentElement.scrollTop=0;
}
document.getElementById('ov').onclick=(e)=>{if(e.target.id==='ov')document.getElementById('ov').classList.remove('open')};
grid();
</script>
</body></html>
