{
  "content": "باب الثلاثي الصحيح من القاف\rقال الخليل: القاف والكافُ لا يأتَلفِان، والجيم لا تأتلف معهما في شيء من الحروف إلا في أحرف معربة قد بينتها في أول الباب الثاني من القاف. ولا تأتلف مع القاف والجيم إلا جِلَّق، ومع السين إلا جَوْسَق. وجِلَّقُ اسم موضع.",
