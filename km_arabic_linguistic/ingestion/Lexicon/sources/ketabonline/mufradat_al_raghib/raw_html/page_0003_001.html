<p class="g-paragraph g-rtl" id="p-1"><span class="g-list">٨-</span>  ترجمة مختصرة للأعلام الواردة، وذكر أماكن ترجمتها.</p><p class="g-paragraph g-rtl" id="p-2"><span class="g-list">٩-</span>  وفي الختام قمنا بعمل الفهارس العلمية للكتاب، لتسهّل للباحث الاطلاع والرجوع.</p><p class="g-paragraph g-rtl" id="p-3">ونسأل الله التوفيق والسداد، والقبول والصواب، وآخر دعوانا أن الحمد لله ربّ العالمين.</p><p class="g-paragraph g-rtl" id="p-4">صفوان داودي المدينة المنورة- شعبان ١٤٠٨ هـ</p>
