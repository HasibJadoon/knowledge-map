<p class="g-paragraph g-rtl" id="p-1">التي تدرك بالبصر التي يعرفها الخاصّة والعامّة، وإلى الزّينة المعقولة التي يختصّ بمعرفتها الخاصّة، وذلك أحكامها وسيرها. وتَزْيِينُ الله للأشياء قد يكون بإبداعها مزيّنة، وإيجادها كذلك، وتَزْيِينُ الناس للشيء: بتزويقهم، أو بقولهم، وهو أن يمدحوه ويذكروه بما يرفع منه.</p><p class="g-paragraph g-rtl" id="p-2">تمّ كتاب الزاي</p>
