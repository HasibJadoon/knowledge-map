<p class="g-paragraph g-rtl" id="p-1">لا رَيْبَ فِيهِ   <span class="g-hadeeth">(( ١ ))</span>   ب: لا شك فيه، فقد فسّر القرآن ووفّاه التبيان.</p><p class="g-paragraph g-rtl" id="p-2">جعل الله لنا التوفيق رائدا، والتقوى سائقا، ونفعنا بما أولانا وجعله لنا من معاون تحصيل الزاد المأمور به في قوله تعالى: وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوى  <span class="g-square-brackets">[البقرة/ ١٩٧]</span>  .</p><p class="g-paragraph g-ltr" id="p-3"><div class="g-page-separator" id="page-separator"></div><div class="g-page-footer"></p><p class="g-paragraph g-rtl" id="p-4"><span class="g-list">(١)</span>  سورة البقرة آية ٢.</div></p>
