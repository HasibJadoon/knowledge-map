<p class="g-paragraph g-rtl" id="p-1">والهَوْجاءُ: الناقة التي كأنَّ بها هَوَجاً من سُرعتها. والهَوْجاءُ: الريح التي تقلع البيوت: والجمع هوجٌ.</p><p class="g-paragraph g-rtl" id="p-2"> <span class="g-square-brackets">[هيج]</span>  هاج الشئ يهيج هيجا وهَيَجاناً، واهْتاجَ وتهَيَّجَ، أي ثارَ. وهاجَهُ غيرُهُ، يتعدى ولا يتعدى. وهيَّجَهُ وهايَجَهُ بمعنًى. والهائج: الفحل الذي يشتهي الضراب. وهاجَ النبتُ هياجا، أي يبس. وأرض</p>
