<p class="g-paragraph g-rtl" id="p-1">وأترك القِرْنَ في الغبارِ وفي حِضْنَيْهِ زرقاه متنها يلق واليلقة: المنز البيضاء.</p><p class="g-paragraph g-rtl" id="p-2"> <span class="g-square-brackets">[يلمق]</span>  اليَلْمَقُ: القَباءُ، فارسيٌّ معرَّب. قال ذوالرمة يصف الثور الوحشى: تجلو البوارق عن مجز نمز لهق <span class="g-parentheses">  <a href="#foot-1" class="g-footnote-link">(١)</a> </span>  ... كأنه متقبى يلمق عزب</p><p class="g-paragraph g-rtl" id="p-3">والجمع اليلامق.</p><p class="g-paragraph g-ltr" id="p-4"><div class="g-page-separator" id="page-separator"></div><div class="g-page-footer"></p><p class="g-paragraph g-rtl" id="p-5"><span class="g-list"> <span id="foot-1" class="g-footnote-target">(١)</span> </span>  في اللسان:  <span class="g-quotes">"عن مجر نم لهق"</span></div></p>
