<p class="g-paragraph g-rtl" id="p-1">ومتى تصبك خصاصة فارج الغنى * وإلى الذى يعطى الرغائب فارغب <span class="g-parentheses"> (١)</span>  وذلك في الميسر.</p><p class="g-paragraph g-rtl" id="p-2"><span class="g-list">(٢)</span>  وأنشد الفراء: أحقا عباد الله أن لست لاقيا * بثينة أو يلقى الثريا رقيبها وإنما قيل للعيوق رقيب الثريا تشبيها برقيب الميسر.</p>
