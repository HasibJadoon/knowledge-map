<p class="g-paragraph g-rtl" id="p-1">ترجو الاعادي أن ألين لها * هذا تخيل صاحب الحلم <span class="g-parentheses"> (١)</span>  الورد ضبطت في اللسان بالفتح وقال: ومن خفض الورد جعله من نعته. قال ابن برى: هذا تصحيف بيع فيه الجوهرى ابن السكيت، وإنما هو اللجن بالنون، من قصيدة نونية. وقبله: من نسوة شمس لا مكره عنف * ولا فواحش في سر ولا علن</p>
