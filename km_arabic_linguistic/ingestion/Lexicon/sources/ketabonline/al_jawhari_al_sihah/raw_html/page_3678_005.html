<p class="g-paragraph g-ltr" id="p-1">(*)</p><p class="g-paragraph g-rtl" id="p-2"><div class="g-title g-rtl" >فصل الياء</div></p><p class="g-paragraph g-rtl" id="p-3"> <span class="g-square-brackets">[يلل]</span>  اليَلَلُ: قصرُ الأسنان العليا، ويقال انعطافُها إلى داخل الفم. ورجلٌ أيَلُّ، وامرأةٌ يَلاَّءُ. قال لبيد: رَقِمِيَّاتٌ عليها ناهِضٌ تُكْلِحُ الأرْوَقَ منهم والأيَلّ أي رميتُهُمْ بسهام. ويليل: موضع. قال جرير: نظرت إليك بمثل عينى مغزل قطعت حبائلها بأعلى يليل</p>
