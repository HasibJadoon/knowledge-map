<p class="g-paragraph g-rtl" id="p-1">= الحال فمكسور لا غير، ما أحسن عمته، وركبته. وحدثني أبو عمر عن ثعلب عن ابن الاعرابي: رأيته رأية واحدة بالفتح. فهذا على أصل ما يجب  <span class="g-quotes">".</p><p class="g-paragraph g-rtl" id="p-2"><span class="g-list">(١)</span>  وعلى القياس روى سيبويه"</span>  قالوا: حجة واحدة - يعنى بالفتح يريدون عمل سنة واحدة ".</p><p class="g-paragraph g-rtl" id="p-3"><span class="g-list">(٢)</span>  بعده: غرائر أبكار عليها مهابة * وعون كرام يرتدين الوصائلا</p>
