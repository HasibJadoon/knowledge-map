<ion-header translucent="true">
  <ion-toolbar class="brainstorm-toolbar km-week-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/brainstorm/topics"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ topic()?.title || 'Ideas' }}</ion-title>
    <ion-buttons slot="end">
      <div class="brainstorm-ideas__count" *ngIf="topic()">{{ countLabel }}</div>
      <ion-button fill="clear" (click)="openComposer()" [disabled]="!topic()" aria-label="Open full editor">
        <ion-icon [icon]="icons.createOutline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="km-shell brainstorm-ideas__content">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="brainstorm-ideas">
    <section class="brainstorm-ideas__state" *ngIf="error() && !loading()">
      <h2>Unable to load topic</h2>
      <p>{{ error() }}</p>
      <ion-button fill="clear" size="small" (click)="retryLoad()">Retry</ion-button>
    </section>

    <section class="brainstorm-ideas__state" *ngIf="loading()">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading ideas…</p>
    </section>

    <ng-container *ngIf="!loading() && !error()">
      <section class="brainstorm-ideas__state" *ngIf="!topic()">
        <h2>Topic not found</h2>
        <p>The selected topic is not available anymore.</p>
      </section>

      <ng-container *ngIf="topic()">
        <div class="brainstorm-ideas__list" *ngIf="ideas().length; else emptyIdeas">
          <app-idea-row
            *ngFor="let idea of ideas(); trackBy: trackIdea"
            [idea]="idea"
            (selected)="openIdea($event)"
            (edited)="openIdea($event)"
            (longPressed)="onIdeaLongPress($event)"
            (toggledPin)="toggleIdeaPin($event)"
            (toggledHighlight)="toggleIdeaHighlight($event)"
            (deleted)="deleteIdeaFromRow($event)"
          ></app-idea-row>
        </div>
      </ng-container>
    </ng-container>
  </div>

  <div slot="fixed" class="brainstorm-ideas__composer-shell" *ngIf="topic()">
    <div class="brainstorm-ideas__composer km-glass">
      <ion-textarea
        #quickCaptureField
        [formControl]="quickCaptureControl"
        autoGrow="true"
        rows="1"
        enterkeyhint="send"
        placeholder="Write a thought…"
        (keydown)="onQuickCaptureKeydown($event)"
      ></ion-textarea>
      <ion-button fill="clear" [disabled]="!canSendQuickCapture" (click)="sendQuickCapture()" aria-label="Save idea">
        <ion-icon [icon]="icons.paperPlaneOutline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>

  <ng-template #emptyIdeas>
    <section class="brainstorm-ideas__state">
      <h2>No ideas yet</h2>
      <p>Capture the first thought below and keep the topic moving.</p>
    </section>
  </ng-template>
</ion-content>
