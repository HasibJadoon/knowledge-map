<ion-content [fullscreen]="true" class="km-shell km-planner-page brainstorm-ideas__content">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="km-planner-wrap ion-padding brainstorm-ideas">
    <section class="km-panel km-empty-state brainstorm-ideas__state" *ngIf="error() && !loading()">
      <h2>Unable to load subtopic</h2>
      <p>{{ error() }}</p>
      <ion-button fill="clear" size="small" (click)="retryLoad()">Retry</ion-button>
    </section>

    <section class="km-panel km-empty-state brainstorm-ideas__state" *ngIf="loading()">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading ideas…</p>
    </section>

    <ng-container *ngIf="!loading() && !error()">
      <section class="km-panel km-empty-state brainstorm-ideas__state" *ngIf="!topic() || !subtopic()">
        <h2>Subtopic not found</h2>
        <p>The selected subtopic is not available anymore.</p>
      </section>

      <ng-container *ngIf="topic() && subtopic()">
        <div class="brainstorm-ideas__list" *ngIf="filteredIdeas().length; else emptyIdeas">
          <app-idea-row
            *ngFor="let idea of filteredIdeas(); trackBy: trackIdea"
            [idea]="idea"
            (selected)="openIdea($event)"
            (edited)="openIdea($event)"
            (longPressed)="onIdeaLongPress($event)"
            (toggledPin)="toggleIdeaPin($event)"
            (toggledHighlight)="toggleIdeaHighlight($event)"
            (deleted)="deleteIdeaFromRow($event)"
          ></app-idea-row>
        </div>
      </ng-container>
    </ng-container>
  </div>

  <ng-template #emptyIdeas>
    <section class="km-panel km-empty-state brainstorm-ideas__state">
      <h2>{{ query() ? 'No matches' : 'No ideas yet' }}</h2>
      <p>{{ query() ? 'Try a different search phrase.' : 'Capture the first thought below and keep the subtopic moving.' }}</p>
    </section>
  </ng-template>
</ion-content>

<ion-footer class="brainstorm-ideas__footer ion-no-border" *ngIf="subtopic()">
  <ion-toolbar class="brainstorm-ideas__footer-bar">
    <div class="brainstorm-ideas__composer km-glass">
      <ion-textarea
        #quickCaptureField
        [formControl]="quickCaptureControl"
        autoGrow="true"
        rows="1"
        enterkeyhint="send"
        placeholder="Write a thought…"
        (keydown)="onQuickCaptureKeydown($event)"
      ></ion-textarea>
      <ion-button fill="clear" [disabled]="!canSendQuickCapture" (click)="sendQuickCapture()" aria-label="Save idea">
        <ion-icon [icon]="icons.paperPlaneOutline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
