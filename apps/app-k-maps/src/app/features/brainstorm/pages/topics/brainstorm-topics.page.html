<ion-content class="brainstorm-topics__content">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="brainstorm-topics__body ion-padding">
    <ion-card class="km-ion-card brainstorm-topics__state-card" *ngIf="error() && !loading()">
      <ion-card-content class="brainstorm-topics__state">
        <h2>Unable to load brainstorm</h2>
        <p>{{ error() }}</p>
        <ion-button fill="clear" size="small" (click)="retryLoad()">Retry</ion-button>
      </ion-card-content>
    </ion-card>

    <ion-card class="km-ion-card brainstorm-topics__state-card" *ngIf="loading()">
      <ion-card-content class="brainstorm-topics__state">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Loading topics…</p>
      </ion-card-content>
    </ion-card>

    <ng-container *ngIf="!loading() && !error()">
      <div class="brainstorm-topics__list" *ngIf="topics().length; else emptyTopics">
        <app-topic-row
          *ngFor="let topic of topics(); trackBy: trackTopic"
          [entry]="topic"
          [count]="topic.subtopicCount"
          countLabelSingular="Subtopic"
          countLabelPlural="Subtopics"
          (selected)="openTopic($event)"
          (longPressed)="onTopicLongPress($event)"
          (archived)="archiveTopic($event)"
          (deleted)="deleteTopicFromRow($event)"
        ></app-topic-row>
      </div>
    </ng-container>
  </div>

  <ng-template #emptyTopics>
    <ion-card class="km-ion-card brainstorm-topics__state-card">
      <ion-card-content class="brainstorm-topics__state">
        <h2>{{ query() ? 'No matches' : 'No topics yet' }}</h2>
        <p>{{ query() ? 'Try a different search phrase.' : 'Capture the first topic below to start organizing subtopics and ideas.' }}</p>
      </ion-card-content>
    </ion-card>
  </ng-template>
</ion-content>

<ion-footer class="brainstorm-topics__footer ion-no-border">
  <ion-toolbar class="brainstorm-topics__footer-bar">
    <div class="brainstorm-topics__composer km-glass">
      <ion-textarea
        #topicCaptureField
        [formControl]="topicCaptureControl"
        autoGrow="true"
        rows="1"
        enterkeyhint="send"
        placeholder="Write a topic…"
        (keydown)="onTopicCaptureKeydown($event)"
      ></ion-textarea>
      <ion-button fill="clear" [disabled]="!canSendTopicCapture" (click)="sendTopicCapture()" aria-label="Create topic">
        <ion-icon [icon]="icons.paperPlaneOutline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
