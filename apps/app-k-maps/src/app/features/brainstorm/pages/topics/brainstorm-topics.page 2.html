<ion-content [fullscreen]="true" class="km-shell km-content-with-bottom-tabs km-planner-page brainstorm-topics__content">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="km-planner-wrap ion-padding brainstorm-topics">
    <section class="km-panel km-empty-state brainstorm-topics__state" *ngIf="error() && !loading()">
      <h2>Unable to load brainstorm</h2>
      <p>{{ error() }}</p>
      <ion-button fill="clear" size="small" (click)="retryLoad()">Retry</ion-button>
    </section>

    <section class="km-panel km-empty-state brainstorm-topics__state" *ngIf="loading()">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading topics…</p>
    </section>

    <ng-container *ngIf="!loading() && !error()">
      <div class="brainstorm-topics__list" *ngIf="topics().length; else emptyTopics">
        <app-topic-row
          *ngFor="let topic of topics(); trackBy: trackTopic"
          [topic]="topic"
          (selected)="openTopic($event)"
          (longPressed)="onTopicLongPress($event)"
          (archived)="archiveTopic($event)"
          (deleted)="deleteTopicFromRow($event)"
        ></app-topic-row>
      </div>
    </ng-container>
  </div>

  <ng-template #emptyTopics>
    <section class="km-panel km-empty-state brainstorm-topics__state">
      <h2>No topics yet</h2>
      <p>Use the add icon in the toolbar to create the first topic.</p>
    </section>
  </ng-template>
</ion-content>
