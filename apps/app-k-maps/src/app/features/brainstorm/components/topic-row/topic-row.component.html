<ion-item-sliding class="brainstorm-topic-row">
  <ion-item
    button
    detail="false"
    lines="none"
    class="brainstorm-topic-row__item"
    appLongPress
    (click)="onSelect()"
    (appLongPress)="onLongPress()"
  >
    <div class="brainstorm-topic-row__media" aria-hidden="true">
      <span>{{ topicInitials }}</span>
    </div>

    <ion-label class="brainstorm-topic-row__body">
      <div class="brainstorm-topic-row__head">
        <h2>{{ entry.title }}</h2>
      </div>

      <div class="brainstorm-topic-row__meta">
        <span class="brainstorm-topic-row__count-inline">{{ count }} {{ countLabel | lowercase }}</span>
        <ion-icon class="brainstorm-topic-row__meta-icon" name="time-outline" aria-hidden="true"></ion-icon>
        <span class="brainstorm-topic-row__stamp">{{ updatedLabel }}</span>
      </div>
    </ion-label>

    <ion-icon class="brainstorm-topic-row__chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="medium" *ngIf="showArchive" (click)="onArchive()">Archive</ion-item-option>
    <ion-item-option color="danger" (click)="onDelete()">Delete</ion-item-option>
  </ion-item-options>
</ion-item-sliding>
