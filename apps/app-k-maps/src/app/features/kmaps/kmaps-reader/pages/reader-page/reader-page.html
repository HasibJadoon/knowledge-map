<app-kmaps-page-header
  [title]="source()?.title || 'K-Maps'"
  [subtitle]="unit()?.locatorLabel || 'Reading workspace'"
  [showBackButton]="true"
  [backHref]="'/worldview/sources/' + sourceId() + '/units/' + unitId()"
>
</app-kmaps-page-header>

<ion-content [fullscreen]="true" class="km-native-page">
  <div class="km-native-page__body km-native-page__body--with-footer">
    <section class="reader-page__section" *ngFor="let section of readingSections(); trackBy: trackSection">
      <div class="reader-page__section-head">
        <span></span>
        <h2>{{ section.heading }}</h2>
      </div>

      <button
        type="button"
        class="reader-page__paragraph"
        *ngFor="let paragraph of section.paragraphs"
        [class.reader-page__paragraph--selected]="selectedParagraphIndex() === paragraph.index"
        [class.reader-page__paragraph--marked]="isMarked(paragraph.index)"
        (click)="selectParagraph(paragraph.index)"
      >
        <span class="reader-page__paragraph-index">{{ paragraph.index + 1 }}</span>
        <span>{{ paragraph.body }}</span>
      </button>
    </section>
  </div>
</ion-content>

<ion-footer class="km-native-page__footer">
  <div class="km-native-page__footer-stack">
    <ion-card class="km-card reader-page__context-sheet" *ngIf="selectedExcerpt()">
      <ion-card-content>
        <div class="reader-page__sheet-head">
          <div>
            <p class="reader-page__sheet-kicker">Selected text</p>
            <span class="reader-page__sheet-locator">{{ selectedLocator() }}</span>
          </div>
        </div>

        <blockquote class="reader-page__sheet-quote">{{ selectedExcerpt() }}</blockquote>

        <div class="reader-page__tone-row">
          <button
            type="button"
            class="reader-page__tone-dot"
            *ngFor="let tone of highlightTones"
            [class.reader-page__tone-dot--active]="highlightTone() === tone"
            [attr.data-tone]="tone"
            (click)="setHighlightTone(tone)"
          ></button>
        </div>

        <div class="reader-page__sheet-actions">
          <button type="button" (click)="highlightSelected()">Highlight</button>
          <button type="button" (click)="openQuickCapture()">Add Note</button>
          <button type="button" (click)="createQuoteNode()">Create Quote Node</button>
          <button type="button" (click)="sendToDistill()">Send to Distill</button>
          <button type="button" (click)="copyExcerpt()">Copy</button>
          <button type="button" (click)="linkToNode()">Link to Node</button>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card class="km-card reader-page__toolbar">
      <ion-card-content>
        <button type="button" [disabled]="!selectedExcerpt()" (click)="highlightSelected()">
          <ion-icon name="color-wand-outline"></ion-icon>
          <span>Highlight</span>
        </button>
        <button type="button" (click)="openQuickCapture()">
          <ion-icon name="create-outline"></ion-icon>
          <span>Note</span>
        </button>
        <button type="button" [disabled]="selectedParagraphIndex() === null" (click)="toggleMarker()">
          <ion-icon name="bookmark-outline"></ion-icon>
          <span>Marker</span>
        </button>
        <button type="button" (click)="jumpToMarker()">
          <ion-icon name="swap-vertical-outline"></ion-icon>
          <span>Jump</span>
        </button>
      </ion-card-content>
    </ion-card>

    <app-kmaps-unit-bottom-tabs [sourceId]="sourceId()" [unitId]="unitId()"></app-kmaps-unit-bottom-tabs>
  </div>
</ion-footer>
