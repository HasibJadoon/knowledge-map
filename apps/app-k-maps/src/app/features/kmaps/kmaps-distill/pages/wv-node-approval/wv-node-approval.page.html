<app-kmaps-page-header
  title="Node Approval"
  [subtitle]="suggestion()?.title || 'Review suggestion'"
  [showBackButton]="true"
  [backHref]="backHref()"
  [showHomeButton]="true"
></app-kmaps-page-header>

<ion-content class="km-native-page">
  <form class="app-page-content" [formGroup]="form">
    <ion-item>
      <ion-label position="stacked">Node title</ion-label>
      <ion-input formControlName="title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Summary</ion-label>
      <ion-textarea formControlName="summary" autoGrow="true"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Node type</ion-label>
      <ion-select formControlName="nodeType" interface="action-sheet">
        <ion-select-option value="concept">Concept</ion-select-option>
        <ion-select-option value="claim">Claim</ion-select-option>
        <ion-select-option value="theme">Theme</ion-select-option>
        <ion-select-option value="output">Output</ion-select-option>
        <ion-select-option value="edge">Edge</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Relation type</ion-label>
      <ion-input formControlName="relationType"></ion-input>
    </ion-item>

    <ion-button expand="block" class="km-btn" (click)="save('approved')">Approve</ion-button>
    <ion-button expand="block" fill="outline" class="km-btn" (click)="save('edited')">Save Edit</ion-button>
    <ion-button expand="block" fill="clear" color="danger" (click)="save('rejected')">Reject</ion-button>
  </form>
</ion-content>
