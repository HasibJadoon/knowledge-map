<app-kmaps-page-header
  [title]="source()?.title || 'K-Maps'"
  [subtitle]="unit()?.locatorLabel || 'Highlight workspace'"
  [showBackButton]="true"
  [backHref]="'/worldview/sources/' + sourceId() + '/units/' + unitId()"
>
</app-kmaps-page-header>

<ion-content [fullscreen]="true" class="km-native-page">
  <div class="km-native-page__body km-native-page__body--with-tabs">
    <ion-card class="km-card highlights-page__hero" *ngIf="unit() as currentUnit">
      <ion-card-content>
        <p class="highlights-page__source">{{ source()?.title }}</p>
        <div class="highlights-page__hero-head">
          <h1>{{ currentUnit.title }}</h1>
          <span>{{ progressPercent() }}% read</span>
        </div>
      </ion-card-content>
    </ion-card>

    <section class="highlights-page__filter-row">
      <button
        type="button"
        class="highlights-page__filter-pill"
        *ngFor="let filter of filters"
        [class.highlights-page__filter-pill--active]="activeFilter() === filter"
        (click)="setFilter(filter)"
      >
        {{ filterLabel(filter) }}
      </button>
    </section>

    <section class="highlights-page__list" *ngIf="filteredHighlights().length; else emptyState">
      <ion-card class="km-card highlights-page__item" *ngFor="let note of filteredHighlights(); trackBy: trackNote">
        <ion-card-content>
          <div class="highlights-page__item-head">
            <div>
              <p class="highlights-page__item-meta">{{ noteMeta(note) }}</p>
              <h2>{{ notePreview(note) }}</h2>
            </div>

            <button type="button" class="highlights-page__menu-button" (click)="openHighlightMenu(note)">
              <ion-icon name="ellipsis-horizontal"></ion-icon>
            </button>
          </div>

          <button type="button" class="highlights-page__item-open" (click)="openHighlight(note.id)">
            Open highlight
          </button>
        </ion-card-content>
      </ion-card>
    </section>

    <ng-template #emptyState>
      <app-kmaps-empty-state-card
        title="No highlights in this filter"
        message="Go back to the read tab, mark a passage, and it will appear here with calm metadata and overflow actions."
        actionLabel="Go to read"
        (actionSelected)="goToRead()"
      ></app-kmaps-empty-state-card>
    </ng-template>
  </div>
</ion-content>

<ion-footer class="km-native-page__footer">
  <app-kmaps-unit-bottom-tabs [sourceId]="sourceId()" [unitId]="unitId()"></app-kmaps-unit-bottom-tabs>
</ion-footer>
