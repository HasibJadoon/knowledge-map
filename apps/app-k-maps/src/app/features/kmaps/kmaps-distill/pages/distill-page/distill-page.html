<app-kmaps-workflow-shell
  title="Select Notes to Distill"
  [subtitle]="heading().subtitle"
  [showBackButton]="true"
  [backHref]="'/worldview/sources/' + sourceId() + '/units/' + unitId()"
  [showHomeButton]="false"
>
  <app-kmaps-unit-workspace-tabs [sourceId]="sourceId()" [unitId]="unitId()"></app-kmaps-unit-workspace-tabs>

  <section class="km-panel km-panel--segment distill-page__filters">
    <ion-segment mode="md" [value]="activeFilter()" (ionChange)="setFilter($event.detail.value)">
      <ion-segment-button value="all">
        <ion-label>All</ion-label>
      </ion-segment-button>
      <ion-segment-button value="highlight">
        <ion-label>Highlights</ion-label>
      </ion-segment-button>
      <ion-segment-button value="reflection">
        <ion-label>Reflections</ion-label>
      </ion-segment-button>
      <ion-segment-button value="claim_seed">
        <ion-label>Claims</ion-label>
      </ion-segment-button>
    </ion-segment>
  </section>

  <section class="km-panel distill-page__list-panel">
    <div class="distill-page__selection-meta">{{ selectedNoteIds().length }} selected</div>

    <ion-list class="distill-page__list" *ngIf="filteredNotes().length; else emptyState">
      <ion-item
        button="true"
        detail="false"
        lines="full"
        class="distill-page__note-row"
        [class.distill-page__note-row--selected]="isSelected(note.id)"
        *ngFor="let note of filteredNotes()"
        (click)="toggleNoteSelection(note.id)"
      >
        <ion-checkbox slot="start" [checked]="isSelected(note.id)"></ion-checkbox>

        <ion-label>
          <h3>{{ note.title || noteLabel(note) }}</h3>
          <p>{{ note.excerptText || note.bodyMd }}</p>
          <span *ngIf="note.locator">{{ note.locator }}</span>
        </ion-label>
      </ion-item>
    </ion-list>

    <ng-template #emptyState>
      <p class="distill-page__empty">No notes in this filter yet.</p>
    </ng-template>
  </section>
</app-kmaps-workflow-shell>
