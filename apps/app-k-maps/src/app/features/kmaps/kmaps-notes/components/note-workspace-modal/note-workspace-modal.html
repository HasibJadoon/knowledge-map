<ion-header class="note-workspace-modal__header">
  <ion-toolbar class="note-workspace-modal__toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="close()">
        Cancel
      </ion-button>
    </ion-buttons>

    <ion-title class="note-workspace-modal__title">
      {{ headerTitle() }}
    </ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="save()">
        Save
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="note-workspace-modal__content">
  <form class="note-workspace-modal__form" [formGroup]="form">
    <section class="note-workspace-modal__section">
      <label class="note-workspace-modal__label">Type</label>

      <ion-item lines="none" class="note-workspace-modal__field">
        <ion-select formControlName="noteKind" interface="popover" placeholder="Select note type">
          <ion-select-option *ngFor="let kind of kindOptions" [value]="kind">
            {{ noteKindLabel(kind) }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </section>

    <section class="note-workspace-modal__section">
      <label class="note-workspace-modal__label" for="note-workspace-statement">Statement</label>

      <ion-item lines="none" class="note-workspace-modal__field">
        <ion-input
          id="note-workspace-statement"
          formControlName="title"
          placeholder="Write a single statement"
        ></ion-input>
      </ion-item>
    </section>

    <section class="note-workspace-modal__section note-workspace-modal__section--grow">
      <label class="note-workspace-modal__label" for="note-workspace-note">Note</label>

      <ion-item lines="none" class="note-workspace-modal__field note-workspace-modal__field--textarea">
        <ion-textarea
          id="note-workspace-note"
          formControlName="bodyMd"
          autoGrow="true"
          rows="12"
          placeholder="Add note details"
        ></ion-textarea>
      </ion-item>
    </section>
  </form>
</ion-content>
