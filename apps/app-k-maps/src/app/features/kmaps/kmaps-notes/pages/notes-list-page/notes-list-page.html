<app-kmaps-page-header
  [title]="toolbarTitle()"
  [subtitle]="toolbarSubtitle()"
  [showBackButton]="true"
  [backHref]="backHref()"
>
  <ion-button kmapsHeaderEnd fill="clear" aria-label="New note" (click)="openCreateNoteModal()">
    <ion-icon name="add-outline"></ion-icon>
  </ion-button>
</app-kmaps-page-header>

<ion-content [fullscreen]="true" class="km-native-page">
  <div class="km-native-page__body km-native-page__body--with-tabs">
    <button type="button" class="notes-page__parent-link" *ngIf="hasParentUnit()" (click)="openParentChapter()">
      <ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon>
      <span>{{ parentUnit()?.title }}</span>
    </button>

    <section class="notes-page__filter-row">
      <button
        type="button"
        class="notes-page__filter-pill"
        *ngFor="let filter of filters"
        [class.notes-page__filter-pill--active]="activeFilter() === filter"
        (click)="setFilter(filter)"
      >
        {{ filterLabel(filter) }}
      </button>
    </section>

    <section class="notes-page__list" *ngIf="filteredNotes().length; else emptyNotes">
      <ion-card
        class="km-card notes-page__card"
        *ngFor="let note of filteredNotes(); trackBy: trackNote"
        [attr.data-kind]="note.noteKind"
      >
        <ion-card-content>
          <div class="notes-page__card-head">
            <span class="notes-page__badge">{{ noteKindLabel(note.noteKind) }}</span>
            <button type="button" class="notes-page__menu-button" (click)="openNoteMenu(note)">
              <ion-icon name="ellipsis-horizontal"></ion-icon>
            </button>
          </div>

          <button type="button" class="notes-page__card-open" (click)="openNoteModal(note.id)">
            <p>{{ notePreview(note) }}</p>
            <span>{{ locatorLabel(note) }}</span>
          </button>
        </ion-card-content>
      </ion-card>
    </section>

    <ng-template #emptyNotes>
      <app-kmaps-empty-state-card
        title="No notes in this filter"
        message="Capture reflections, questions, ideas, or claim seeds from the chapter and they will collect here in a calmer workspace."
        actionLabel="Create note"
        (actionSelected)="openCreateNoteModal()"
      ></app-kmaps-empty-state-card>
    </ng-template>
  </div>
</ion-content>

<ion-footer class="km-native-page__footer">
  <app-kmaps-unit-bottom-tabs [sourceId]="sourceId()" [unitId]="unitId()"></app-kmaps-unit-bottom-tabs>
</ion-footer>
