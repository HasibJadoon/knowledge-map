<ion-segment
  class="wv-notes-tab__filters"
  [scrollable]="true"
  [value]="activeFilter"
  (ionChange)="onFilterChange($event.detail.value)"
>
  <ion-segment-button *ngFor="let filter of filters" [value]="filter">
    <ion-label>{{ filterLabel(filter) }}</ion-label>
  </ion-segment-button>
</ion-segment>

<ion-card class="km-card wv-notes-tab__card" *ngFor="let note of notes; trackBy: trackNote">
  <ion-card-content>
    <div class="wv-notes-tab__card-head">
      <ion-chip>{{ kindLabel(note.noteKind) }}</ion-chip>
      <span class="wv-notes-tab__locator" *ngIf="note.locator">{{ note.locator }}</span>
    </div>

    <blockquote
      class="wv-notes-tab__excerpt"
      *ngIf="note.excerptText"
      [class.wv-notes-tab__excerpt--arabic]="isArabicText(note.excerptText)"
      [attr.lang]="isArabicText(note.excerptText) ? 'ar' : 'en'"
      [attr.dir]="isArabicText(note.excerptText) ? 'rtl' : 'ltr'"
    >
      {{ note.excerptText }}
    </blockquote>
    <p
      class="wv-notes-tab__body"
      [class.wv-notes-tab__body--arabic]="isArabicText(preview(note))"
      [attr.lang]="isArabicText(preview(note)) ? 'ar' : 'en'"
      [attr.dir]="isArabicText(preview(note)) ? 'rtl' : 'ltr'"
    >
      {{ preview(note) }}
    </p>

    <div class="wv-notes-tab__actions">
      <ion-button fill="clear" size="small" title="Edit note" aria-label="Edit note" (click)="editNote.emit(note)">
        <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" color="danger" title="Delete note" aria-label="Delete note" (click)="deleteNote.emit(note)">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" title="Send to distill" aria-label="Send to distill" (click)="sendToDistill.emit(note)">
        <ion-icon slot="icon-only" name="sparkles-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-card-content>
</ion-card>

<app-kmaps-empty-state-card
  *ngIf="!notes.length"
  title="No notes yet"
  [message]="emptyMessage"
  actionLabel="Create note"
  (actionSelected)="createNote.emit()"
></app-kmaps-empty-state-card>
