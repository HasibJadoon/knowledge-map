<section class="wv-read-tab__scope-row" *ngIf="readUnits.length > 1">
  <button
    type="button"
    class="wv-read-tab__scope-chip"
    *ngFor="let readUnit of readUnits; trackBy: trackUnit"
    [class.wv-read-tab__scope-chip--active]="selectedReadUnit?.id === readUnit.id"
    (click)="scopeSelected.emit(readUnit.id)"
  >
    {{ readUnit.locatorLabel || readUnit.title }}
  </button>
</section>

<section class="wv-read-tab__reading" *ngIf="displayedSegments.length; else noReading">
  <article
    #passageRoot
    class="wv-read-tab__passage"
    [class.wv-read-tab__passage--arabic]="isMostlyArabic()"
    [attr.lang]="isMostlyArabic() ? 'ar' : 'en'"
    [attr.dir]="isMostlyArabic() ? 'rtl' : 'ltr'"
    (mousedown)="onPassageMouseDown($event)"
    (mouseup)="captureSelection()"
    (touchend)="captureSelection()"
    (keyup)="captureSelection()"
    (contextmenu)="onPassageContextMenu($event)"
  >
    <span
      class="wv-read-tab__segment"
      *ngFor="let segment of displayedSegments; trackBy: trackSegment"
      [class.wv-read-tab__segment--arabic]="isArabicText(segment.body)"
      [class.wv-read-tab__segment--english]="!isArabicText(segment.body)"
      [class.wv-read-tab__segment--selected]="isSegmentSelected(segment.index)"
      [attr.data-segment-index]="segment.index"
      [attr.data-locator]="segment.locator"
      [attr.lang]="isArabicText(segment.body) ? 'ar' : 'en'"
      [attr.dir]="isArabicText(segment.body) ? 'rtl' : 'ltr'"
      (mousedown)="onSegmentMouseDown($event, segment.index)"
      (click)="onSegmentClick(segment.index)"
      (contextmenu)="onSegmentContextMenu($event, segment.index)"
    >
      <span class="wv-read-tab__segment-body">{{ segment.body }}</span>
      <span class="wv-read-tab__segment-marker" *ngIf="shouldRenderMarker(segment)" aria-hidden="true">
        {{ segment.marker }}
      </span>
    </span>
  </article>
</section>

<ng-template #noReading>
  <app-kmaps-empty-state-card
    title="No reading in this view"
    [message]="normalizedQuery ? 'Clear the search to view the full reading text for this source unit.' : 'This source unit does not have reading text yet.'"
    [actionLabel]="normalizedQuery ? 'Back to overview' : 'Back to overview'"
    (actionSelected)="backToOverview.emit()"
  ></app-kmaps-empty-state-card>
</ng-template>
