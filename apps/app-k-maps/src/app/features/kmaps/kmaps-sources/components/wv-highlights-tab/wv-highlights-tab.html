<ion-card
  class="km-card wv-highlights-tab__card"
  *ngFor="let note of highlights; trackBy: trackNote"
  [style.--wv-highlight-rgb]="highlightColorRgb(note)"
>
  <ion-card-content>
    <p class="wv-highlights-tab__meta">{{ meta(note) }}</p>
    <h2
      [class.wv-highlights-tab__text--arabic]="isArabicText(preview(note))"
      [class.wv-highlights-tab__text--english]="!isArabicText(preview(note))"
      [attr.lang]="isArabicText(preview(note)) ? 'ar' : 'en'"
      [attr.dir]="isArabicText(preview(note)) ? 'rtl' : 'ltr'"
    >
      {{ preview(note) }}
    </h2>

    <div class="wv-highlights-tab__actions">
      <ion-button fill="clear" size="small" title="Add note" aria-label="Add note" (click)="addNote.emit(note)">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" title="Edit highlight" aria-label="Edit highlight" (click)="editHighlight.emit(note)">
        <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" color="danger" title="Delete highlight" aria-label="Delete highlight" (click)="deleteHighlight.emit(note)">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" title="Send to distill" aria-label="Send to distill" (click)="sendToDistill.emit(note)">
        <ion-icon slot="icon-only" name="sparkles-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-card-content>
</ion-card>

<app-kmaps-empty-state-card
  *ngIf="!highlights.length"
  title="No highlights yet"
  [message]="emptyMessage"
  actionLabel="Go to read"
  (actionSelected)="goToRead.emit()"
></app-kmaps-empty-state-card>
