<app-kmaps-page-header
  [title]="unit()?.title || 'Source Unit'"
  [showBackButton]="true"
  [backHref]="backHref()"
  [showHomeButton]="true"
  [showSearch]="true"
  [searchValue]="searchQuery()"
  [searchPlaceholder]="searchPlaceholder()"
  (searchChange)="onSearchChange($event)"
></app-kmaps-page-header>

<ion-content class="km-native-page wv-unit-workspace__content">
  <div class="app-page-content app-page-content--wide wv-unit-workspace__body wv-unit-workspace__body--with-tabs">
    <ng-container [ngSwitch]="activeTab()">
      <app-wv-overview-tab
        *ngSwitchCase="'overview'"
        [unit]="unit()"
        [stats]="stats()"
        [structureUnits]="filteredOverviewUnits()"
        [recentHighlights]="recentHighlights()"
        [recentNotes]="recentNotes()"
        [isEmpty]="isEmptyState()"
        (viewHighlights)="setActiveTab('highlights')"
        (viewNotes)="setActiveTab('notes')"
        (openUnit)="openUnit($event)"
        (openNote)="openNote($event)"
      ></app-wv-overview-tab>

      <app-wv-read-tab
        *ngSwitchCase="'read'"
        [readUnits]="readUnits()"
        [selectedReadUnit]="selectedReadUnit()"
        [displayedSegments]="displayedReadingSegments()"
        [selectedSegmentIndexes]="selectedSegmentIndexes()"
        [selectedExcerpt]="selectedExcerpt()"
        [selectedLocator]="selectedLocator()"
        [normalizedQuery]="normalizedQuery()"
        (scopeSelected)="selectReadUnit($event)"
        (selectionChanged)="onReadSelectionChange($event)"
        (segmentToggleRequested)="toggleReadSegment($event)"
        (contextMenuRequested)="onReadContextMenu($event)"
        (highlightRequested)="highlightSelected()"
        (noteRequested)="openCreateNoteModal('quote')"
        (copyRequested)="copySelectedExcerpt()"
        (linkNodeRequested)="linkSelectedToNode()"
        (backToOverview)="setActiveTab('overview')"
      ></app-wv-read-tab>

      <app-wv-highlights-tab
        *ngSwitchCase="'highlights'"
        [highlights]="filteredHighlights()"
        [emptyMessage]="highlightsEmptyMessage()"
        (addNote)="openNoteFromHighlight($event)"
        (editHighlight)="openNote($event)"
        (deleteHighlight)="deleteHighlight($event)"
        (sendToDistill)="startDistill()"
        (goToRead)="setActiveTab('read')"
      ></app-wv-highlights-tab>

      <app-wv-notes-tab
        *ngSwitchCase="'notes'"
        [notes]="filteredNotes()"
        [filters]="noteFilters"
        [activeFilter]="activeNotesFilter()"
        [emptyMessage]="noteEmptyMessage()"
        (activeFilterChange)="onNotesFilterChange($event)"
        (createNote)="openCreateNoteModal()"
        (editNote)="openNote($event)"
        (deleteNote)="deleteNote($event)"
        (sendToDistill)="startDistill()"
      ></app-wv-notes-tab>
    </ng-container>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end" *ngIf="showDistillFab()">
    <ion-fab-button
      class="wv-unit-workspace__fab-button"
      aria-label="Start Distill"
      title="Start Distill"
      (click)="startDistill()"
    >
      <ion-icon name="sparkles-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<button
  type="button"
  class="wv-read-context-menu__backdrop"
  *ngIf="readContextMenuOpen()"
  aria-label="Close reading context menu"
  (click)="closeReadContextMenu()"
  (contextmenu)="$event.preventDefault(); closeReadContextMenu()"
></button>

<section
  class="wv-read-context-menu"
  *ngIf="readContextMenuOpen()"
  [style.left.px]="readContextMenuLeft()"
  [style.top.px]="readContextMenuTop()"
  (click)="$event.stopPropagation()"
  (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
>
  <button type="button" class="wv-read-context-menu__item" (click)="highlightFromContextMenu()">
    <ion-icon name="color-wand-outline" aria-hidden="true"></ion-icon>
    <span>Highlight</span>
  </button>
  <button type="button" class="wv-read-context-menu__item" (click)="takeNoteFromContextMenu()">
    <ion-icon name="create-outline" aria-hidden="true"></ion-icon>
    <span>Take Note</span>
  </button>
  <button type="button" class="wv-read-context-menu__item" (click)="copyFromContextMenu()">
    <ion-icon name="copy-outline" aria-hidden="true"></ion-icon>
    <span>Copy</span>
  </button>
  <button type="button" class="wv-read-context-menu__item" (click)="linkNodeFromContextMenu()">
    <ion-icon name="share-social-outline" aria-hidden="true"></ion-icon>
    <span>Link Node</span>
  </button>
</section>

<ion-footer class="km-native-page__footer">
  <app-kmaps-unit-workspace-tabs [activeTab]="activeTab()" (activeTabChange)="setActiveTab($event)"></app-kmaps-unit-workspace-tabs>
</ion-footer>
