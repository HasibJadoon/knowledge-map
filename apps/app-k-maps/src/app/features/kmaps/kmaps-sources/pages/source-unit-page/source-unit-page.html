<ion-header class="source-unit-page__header">
  <ion-toolbar class="source-unit-page__toolbar">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref()" text=""></ion-back-button>
    </ion-buttons>

    <ion-title class="source-unit-page__title">
      <span>{{ unit()?.title || 'Source Unit' }}</span>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button
        class="source-unit-page__toolbar-button"
        fill="clear"
        size="small"
        aria-label="Dashboard"
        (click)="goToDashboard()"
      >
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="source-unit-page__search-toolbar app-page-toolbar--search">
    <div class="source-unit-page__search-row">
      <app-native-searchbar
        class="source-unit-page__searchbar"
        [value]="searchQuery()"
        [placeholder]="searchPlaceholder()"
        (valueChange)="onSearchChange($event)"
      ></app-native-searchbar>

      <app-add-button
        class="source-unit-page__add-button"
        variant="compact"
        ariaLabel="Add passage"
        title="Add passage"
        (pressed)="addChildUnit($event)"
      ></app-add-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="source-unit-page__content">
  <div class="source-unit-page__content-top" *ngIf="source() && unit()">
    <app-source-content-menu
      [sourceId]="sourceId()"
      [sourceTitle]="source()?.title || ''"
      [unitId]="unitId()"
      [unitTitle]="unit()?.title || ''"
    ></app-source-content-menu>
  </div>

  <ion-list class="source-unit-page__list" lines="full" *ngIf="visibleUnits().length; else noUnits">
    <ion-item
      class="source-unit-page__item"
      *ngFor="let child of visibleUnits(); trackBy: trackUnit"
      lines="full"
      detail="false"
      button
      (click)="openUnit(child.id)"
    >
      <ion-label class="source-unit-page__copy">
        <h2>{{ child.title }}</h2>
        <p>{{ unitMeta(child) }}</p>
      </ion-label>

      <div slot="end" class="source-unit-page__actions">
        <ion-button
          fill="clear"
          size="small"
          class="source-unit-page__action-button"
          aria-label="Edit unit"
          title="Edit unit"
          (click)="editUnit(child.id, $event)"
        >
          <ion-icon name="create-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-icon class="source-unit-page__chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </div>
    </ion-item>
  </ion-list>

  <ng-template #noUnits>
    <div class="source-unit-page__empty-state">
      <app-kmaps-empty-state-card
        [title]="emptyTitle()"
        [message]="emptyMessage()"
        actionLabel="Back"
        (actionSelected)="goBack()"
      ></app-kmaps-empty-state-card>
    </div>
  </ng-template>
</ion-content>
