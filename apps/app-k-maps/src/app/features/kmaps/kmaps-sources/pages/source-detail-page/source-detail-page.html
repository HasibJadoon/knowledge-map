<ion-header class="source-detail-page__header">
  <ion-toolbar class="source-detail-page__toolbar">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="libraryHref()" text=""></ion-back-button>
    </ion-buttons>

    <ion-title class="source-detail-page__title">
      <span>{{ currentSource().title }}</span>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button
        class="source-detail-page__toolbar-button"
        fill="clear"
        size="small"
        aria-label="Dashboard"
        (click)="goToDashboard()"
      >
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="source-detail-page__search-toolbar app-page-toolbar--search">
    <div class="source-detail-page__search-row">
      <app-native-searchbar
        class="source-detail-page__searchbar"
        [value]="searchQuery()"
        placeholder="Search chapters or sections"
        (valueChange)="onSearchChange($event)"
      ></app-native-searchbar>

      <app-add-button
        class="source-detail-page__add-button"
        variant="compact"
        ariaLabel="Add chapter"
        title="Add chapter"
        (pressed)="addTopLevelUnit($event)"
      ></app-add-button>
    </div>
  </ion-toolbar>

  <ion-toolbar class="source-detail-page__progress-toolbar">
    <div class="source-detail-page__progress-ribbon">
      <div class="source-detail-page__progress-head source-detail-page__progress-head--compact">
        <div class="source-detail-page__progress-copy-wrap">
          <span>Reading Progress</span>
          <p class="source-detail-page__progress-copy">{{ progressCopy() }}</p>
        </div>
        <div class="source-detail-page__progress-actions">
          <strong>{{ progressPercent() }}%</strong>
          <ion-button
            size="small"
            class="source-detail-page__resume-button"
            fill="clear"
            aria-label="Resume reading"
            title="Resume reading"
            (click)="resumeReading()"
          >
            <ion-icon name="play-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>

      <ion-progress-bar [value]="progressPercent() / 100"></ion-progress-bar>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="source-detail-page__content">
  <ion-list class="source-detail-page__outline-list" lines="full" *ngIf="outlineUnits().length; else noUnits">
    <ng-container *ngFor="let unit of outlineUnits(); trackBy: trackUnit; let isFirst = first">
      <ion-item-divider
        *ngIf="!isFirst"
        class="source-detail-page__divider"
        sticky="false"
      ></ion-item-divider>

      <ion-item
        class="source-detail-page__unit-item"
        lines="full"
        detail="false"
        button
        (click)="openUnit(unit.id)"
      >
        <ion-label class="source-detail-page__unit-copy">
          <h2>{{ unit.title }}</h2>
          <p class="source-detail-page__unit-meta">{{ unitMeta(unit) }}</p>
        </ion-label>

        <div slot="end" class="source-detail-page__unit-actions">
          <ion-button
            fill="clear"
            size="small"
            class="source-detail-page__action-button"
            aria-label="Edit unit"
            title="Edit unit"
            (click)="editUnit(unit.id, $event)"
          >
            <ion-icon name="create-outline" slot="icon-only"></ion-icon>
          </ion-button>

          <ion-icon
            class="source-detail-page__unit-trailing"
            name="chevron-forward-outline"
            aria-hidden="true"
          ></ion-icon>
        </div>
      </ion-item>
    </ng-container>
  </ion-list>

  <ng-template #noUnits>
    <div class="source-detail-page__empty-state">
      <app-kmaps-empty-state-card
        [title]="emptyTitle()"
        [message]="emptyMessage()"
        actionLabel="Back to library"
        (actionSelected)="goBackToLibrary()"
      ></app-kmaps-empty-state-card>
    </div>
  </ng-template>
</ion-content>
