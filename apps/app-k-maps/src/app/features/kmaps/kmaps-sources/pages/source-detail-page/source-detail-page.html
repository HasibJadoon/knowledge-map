<ion-header class="source-detail-page__header">
  <ion-toolbar class="source-detail-page__toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/worldview/library" text=""></ion-back-button>
    </ion-buttons>

    <ion-title class="source-detail-page__title">
      <span>{{ currentSource().title }}</span>
      <small *ngIf="headerSubtitle()">{{ headerSubtitle() }}</small>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button
        fill="clear"
        size="small"
        routerLink="/dashboard"
        routerDirection="root"
        aria-label="Dashboard"
      >
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="source-detail-page__search-toolbar app-page-toolbar--search">
    <app-native-searchbar
      [value]="searchQuery()"
      placeholder="Search chapters or sections"
      (valueChange)="onSearchChange($event)"
    ></app-native-searchbar>
  </ion-toolbar>

  <ion-toolbar class="source-detail-page__progress-toolbar">
    <div class="source-detail-page__progress-ribbon">
      <div class="source-detail-page__progress-head source-detail-page__progress-head--compact">
        <div class="source-detail-page__progress-copy-wrap">
          <span>Reading Progress</span>
          <p class="source-detail-page__progress-copy">{{ progressCopy() }}</p>
        </div>
        <div class="source-detail-page__progress-actions">
          <strong>{{ progressPercent() }}%</strong>
          <ion-button
            size="small"
            class="source-detail-page__resume-button"
            fill="clear"
            aria-label="Resume reading"
            title="Resume reading"
            (click)="resumeReading()"
          >
            <ion-icon name="play-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>

      <ion-progress-bar [value]="progressPercent() / 100"></ion-progress-bar>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="source-detail-page__content">
  <ion-list class="source-detail-page__outline-list" lines="full" *ngIf="outlineGroups().length; else noUnits">
    <ng-container *ngFor="let group of outlineGroups(); trackBy: trackGroup; let isFirst = first">
      <ion-item-divider
        *ngIf="!isFirst"
        class="source-detail-page__divider"
        sticky="false"
      ></ion-item-divider>

      <ion-item
        class="source-detail-page__unit-item"
        lines="full"
        detail="false"
        button
        (click)="openUnit(group.unit.id)"
      >
        <ion-label class="source-detail-page__unit-copy">
          <h2>{{ group.unit.title }}</h2>
          <p class="source-detail-page__unit-meta" *ngIf="searchQuery().trim() && group.unit.locatorLabel">
            {{ group.unit.locatorLabel }}
          </p>
        </ion-label>

        <ion-button
          *ngIf="group.isExpandable"
          slot="end"
          fill="clear"
          class="source-detail-page__unit-toggle"
          (click)="toggleOutlineGroup($event, group.unit.id)"
          [attr.aria-label]="group.isExpanded ? 'Collapse chapter sections' : 'Expand chapter sections'"
        >
          <ion-icon [name]="chapterChevron(group)" aria-hidden="true"></ion-icon>
        </ion-button>

        <ion-icon
          *ngIf="!group.isExpandable"
          slot="end"
          class="source-detail-page__unit-trailing"
          [name]="chapterChevron(group)"
          aria-hidden="true"
        ></ion-icon>
      </ion-item>

      <ng-container *ngIf="group.visibleChildren.length">
        <ion-item
          class="source-detail-page__section-item"
          *ngFor="let child of group.visibleChildren; trackBy: trackUnit"
          lines="full"
          detail="false"
          button
          (click)="openUnit(child.id)"
        >
          <span class="source-detail-page__section-mark" slot="start" aria-hidden="true"></span>

          <ion-label class="source-detail-page__section-copy">
            <h3>{{ child.title }}</h3>
            <p *ngIf="searchQuery().trim() && child.locatorLabel">{{ child.locatorLabel }}</p>
          </ion-label>
        </ion-item>
      </ng-container>
    </ng-container>
  </ion-list>

  <ng-template #noUnits>
    <div class="source-detail-page__empty-state">
      <app-kmaps-empty-state-card
        [title]="emptyTitle()"
        [message]="emptyMessage()"
        actionLabel="Back to library"
        (actionSelected)="goBackToLibrary()"
      ></app-kmaps-empty-state-card>
    </div>
  </ng-template>
</ion-content>
