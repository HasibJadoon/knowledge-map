<ion-header class="library-page__header">
  <ion-toolbar class="library-page__toolbar">
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>

    <ion-title>Library</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" size="small" routerLink="/dashboard" routerDirection="root" aria-label="Dashboard">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="library-page__search-toolbar app-page-toolbar--search">
    <div class="library-page__search-row">
      <app-native-searchbar
        class="library-page__searchbar"
        [value]="searchQuery()"
        placeholder="Search library"
        (valueChange)="onSearchChange($event)"
      ></app-native-searchbar>

      <app-add-button
        class="library-page__add-button"
        variant="compact"
        ariaLabel="Add source"
        title="Add source"
        (pressed)="openNewSource()"
      >
      </app-add-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="library-page__content">
  <ion-list class="library-page__list" lines="full" *ngIf="visibleEntries().length; else emptyLibrary">
    <ion-item
      *ngFor="let entry of visibleEntries(); trackBy: trackEntry"
      class="library-page__item"
      lines="full"
      button
      detail="false"
      (click)="openSource(entry.source.id)"
    >
      <button
        slot="start"
        type="button"
        class="library-page__cover library-page__cover-button"
        [attr.aria-label]="'Edit ' + entry.source.title"
        [attr.title]="'Edit ' + entry.source.title"
        (click)="openEditSource($event, entry.source.id)"
      >
        <ion-icon [name]="entry.iconName"></ion-icon>
      </button>

      <ion-label class="library-page__copy">
        <h2>{{ entry.source.title }}</h2>
        <p class="library-page__primary">{{ entry.primaryMeta }}</p>
        <p class="library-page__secondary">{{ entry.secondaryMeta }}</p>
      </ion-label>

      <div slot="end" class="library-page__end">
        <button
          *ngIf="entry.peopleSummary as peopleSummary"
          type="button"
          class="library-page__meta-trigger"
          [class.library-page__meta-trigger--icon-only]="!peopleSummary.moreLabel"
          [attr.aria-label]="peopleSummary.ariaLabel"
          (click)="openSourceMetadata($event, entry.source.id)"
        >
          <span class="library-page__avatar">{{ peopleSummary.initials }}</span>
          <span class="library-page__meta-count" *ngIf="peopleSummary.moreLabel">{{ peopleSummary.moreLabel }}</span>
        </button>

        <ion-icon class="library-page__chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </div>
    </ion-item>
  </ion-list>

  <ng-template #emptyLibrary>
    <div class="library-page__empty">
      <app-kmaps-empty-state-card
        [title]="emptyTitle()"
        [message]="emptyMessage()"
        actionLabel="Add source"
        (actionSelected)="openNewSource()"
      ></app-kmaps-empty-state-card>
    </div>
  </ng-template>
</ion-content>
