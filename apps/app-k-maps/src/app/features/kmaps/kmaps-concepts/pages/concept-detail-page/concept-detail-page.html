<app-kmaps-page-header
  title="Concept Graph"
  [subtitle]="currentConcept()?.label || unit()?.title || ''"
  [showBackButton]="true"
  [backHref]="unitId() ? '/worldview/sources/' + sourceId() + '/units/' + unitId() : '/worldview/library'"
></app-kmaps-page-header>

<ion-content [fullscreen]="true" class="km-native-page">
  <div class="km-native-page__body" [class.km-native-page__body--with-tabs]="sourceId() && unitId()">
    <ion-searchbar
      class="km-searchbar concept-detail-page__search"
      [value]="conceptQuery()"
      placeholder="Search concepts..."
      debounce="150"
      (ionInput)="updateConceptQuery($event.detail.value)"
    ></ion-searchbar>

    <section class="concept-detail-page__chip-row" *ngIf="filteredConcepts().length">
      <button
        type="button"
        class="concept-detail-page__chip"
        *ngFor="let concept of filteredConcepts(); trackBy: trackConcept"
        [class.concept-detail-page__chip--active]="activeConceptId() === concept.id"
        (click)="selectConcept(concept.id)"
      >
        {{ concept.label }}
      </button>
    </section>

    <ion-card class="km-card concept-detail-page__hero" *ngIf="currentConcept() as concept">
      <ion-card-content>
        <p class="km-panel-kicker">{{ concept.category }}</p>
        <h1>{{ concept.label }}</h1>
        <p class="km-panel-subtitle">{{ concept.summary }}</p>
      </ion-card-content>
    </ion-card>

    <section class="concept-detail-page__note-stack" *ngIf="visibleNotes().length; else emptyState">
      <ion-card class="km-card concept-detail-page__note-card" *ngFor="let note of visibleNotes(); trackBy: trackNote">
        <ion-card-content>
          <div class="concept-detail-page__note-head">
            <span>{{ noteLabel(note) }}</span>
            <ion-icon name="chevron-down-outline"></ion-icon>
          </div>
          <h3>{{ note.title || noteLabel(note) }}</h3>
          <p>{{ note.excerptText || note.bodyMd }}</p>
        </ion-card-content>
      </ion-card>
    </section>

    <ng-template #emptyState>
      <ion-card class="km-card concept-detail-page__empty">
        <ion-card-content>No concept-linked notes in this context yet.</ion-card-content>
      </ion-card>
    </ng-template>
  </div>
</ion-content>

<ion-footer class="km-native-page__footer" *ngIf="sourceId() && unitId()">
  <app-kmaps-unit-bottom-tabs [sourceId]="sourceId()" [unitId]="unitId()"></app-kmaps-unit-bottom-tabs>
</ion-footer>
