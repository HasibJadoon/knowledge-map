<button type="button" class="concept-link-row km-subcard" (click)="selected.emit(concept.id)">
  <span class="concept-link-row__node" aria-hidden="true"></span>

  <div class="concept-link-row__copy">
    <p class="concept-link-row__eyebrow">{{ concept.category }}</p>
    <h3>{{ concept.label }}</h3>
    <p>{{ detail || concept.summary }}</p>
  </div>
</button>
