<ion-card class="km-ion-card kmaps-empty-state">
  <ion-card-content class="kmaps-empty-state__content">
    <div class="kmaps-empty-state__icon">
      <ion-icon [name]="icon"></ion-icon>
    </div>

    <div class="kmaps-empty-state__copy">
      <h3>{{ title }}</h3>
      <p>{{ message }}</p>
    </div>

    <ion-button *ngIf="actionLabel" fill="outline" (click)="actionSelected.emit()">
      {{ actionLabel }}
    </ion-button>
  </ion-card-content>
</ion-card>
