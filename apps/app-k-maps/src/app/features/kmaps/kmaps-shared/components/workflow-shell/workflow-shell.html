<ion-header class="kmaps-workflow-shell__header" *ngIf="showHeader">
  <ion-toolbar class="kmaps-workflow-shell__toolbar">
    <ion-buttons slot="start">
      <ion-menu-button *ngIf="showMenuButton"></ion-menu-button>
      <ion-back-button *ngIf="showBackButton" [defaultHref]="backHref" text=""></ion-back-button>
    </ion-buttons>

    <ion-title
      class="kmaps-workflow-shell__title"
      [class.kmaps-workflow-shell__title--start]="titleAlignment === 'start'"
    >
      <span>{{ title }}</span>
      <small *ngIf="subtitle">{{ subtitle }}</small>
    </ion-title>

    <ion-buttons slot="end">
      <ng-content select="[kmapsToolbarEnd]"></ng-content>
      <ion-button *ngIf="showHomeButton" fill="clear" [routerLink]="homeHref" routerDirection="root" aria-label="Dashboard">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar class="kmaps-workflow-shell__toolbar kmaps-workflow-shell__toolbar--search" *ngIf="showSearch">
    <ion-searchbar
      class="kmaps-workflow-shell__searchbar"
      [value]="searchValue"
      debounce="150"
      [placeholder]="searchPlaceholder"
      show-clear-button="focus"
      (ionInput)="onSearchInput($event.detail.value)"
    ></ion-searchbar>
  </ion-toolbar>

  <ng-content select="[kmapsHeaderAfterSearch]"></ng-content>
</ion-header>

<ion-content class="km-shell kmaps-workflow-shell__content">
  <div class="kmaps-workflow-shell__inner">
    <ng-content></ng-content>
  </div>
</ion-content>

<ion-footer class="kmaps-workflow-shell__footer" *ngIf="showFooter">
  <ng-content select="[kmapsShellFooter]"></ng-content>
</ion-footer>
