<header class="kmaps-section-header">
  <div class="kmaps-section-header__copy">
    <p class="kmaps-section-header__eyebrow" *ngIf="eyebrow">{{ eyebrow }}</p>
    <h2>{{ title }}</h2>
    <p class="kmaps-section-header__subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <ion-button *ngIf="actionLabel" fill="clear" size="small" (click)="actionSelected.emit()">
    {{ actionLabel }}
  </ion-button>
</header>
