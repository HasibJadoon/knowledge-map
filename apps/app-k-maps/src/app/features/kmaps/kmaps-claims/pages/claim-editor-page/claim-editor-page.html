<app-kmaps-page-header
  title="Convert Into Claim"
  [subtitle]="unit()?.locatorLabel || ''"
  [showBackButton]="true"
  [backHref]="unitId() ? '/worldview/sources/' + sourceId() + '/units/' + unitId() : '/worldview/library'"
></app-kmaps-page-header>

<ion-content [fullscreen]="true" class="km-native-page">
  <div class="km-native-page__body km-native-page__body--with-footer">
    <ion-card class="km-card claim-editor-page__note-card" *ngIf="primaryNote() as note">
      <ion-card-content>
        <div class="claim-editor-page__note-head">
          <div class="claim-editor-page__note-kind"></div>
          <div class="claim-editor-page__note-copy">
            <h2>{{ note.title || noteKindLabel(note) }}</h2>
            <p>{{ note.locator }}</p>
          </div>
          <ion-icon name="link-outline"></ion-icon>
        </div>

        <blockquote class="km-quote-block" *ngIf="note.excerptText">{{ note.excerptText }}</blockquote>
        <p class="claim-editor-page__note-body">{{ note.bodyMd }}</p>
      </ion-card-content>
    </ion-card>

    <ion-card class="km-card claim-editor-page__editor">
      <ion-card-content>
        <form [formGroup]="form">
          <ion-item lines="none" class="claim-editor-page__field claim-editor-page__field--body">
            <ion-textarea
              formControlName="claimText"
              autoGrow="true"
              rows="7"
              placeholder="Distill the note cluster into one clear claim."
            ></ion-textarea>
          </ion-item>
        </form>
      </ion-card-content>
    </ion-card>

    <div class="claim-editor-page__actions">
      <ion-button fill="outline" (click)="openContextConcepts()">Link Concept</ion-button>
      <ion-button fill="outline" (click)="openContextDistill()">Queue Distill</ion-button>
    </div>
  </div>
</ion-content>

<ion-footer class="km-native-page__footer">
  <div class="km-native-page__footer-stack claim-editor-page__footer">
    <ion-button class="km-primary-btn" (click)="save()">Save Note</ion-button>
    <app-kmaps-unit-bottom-tabs *ngIf="sourceId() && unitId()" [sourceId]="sourceId()" [unitId]="unitId()"></app-kmaps-unit-bottom-tabs>
  </div>
</ion-footer>
