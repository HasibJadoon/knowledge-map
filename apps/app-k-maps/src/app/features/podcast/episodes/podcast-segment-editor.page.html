<ion-header translucent="true">
  <ion-toolbar class="podcast-builder-toolbar km-week-toolbar">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="km-shell podcast-segment__content">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="podcast-segment">
    <section class="podcast-segment__state" *ngIf="error() && !loading()">
      <h2>Unable to load segment</h2>
      <p>{{ error() }}</p>
      <ion-button fill="clear" size="small" (click)="retry()">Retry</ion-button>
    </section>

    <section class="podcast-segment__state" *ngIf="loading()">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading segment…</p>
    </section>

    <form class="podcast-segment__form" [formGroup]="form" *ngIf="episode() && !loading() && !error() && segmentIndex() >= 0">
      <section class="podcast-segment__section">
        <div class="podcast-segment__detail-list" [formArrayName]="detailFormArrayName">
          <ion-reorder-group [disabled]="saving()" (ionItemReorder)="reorderDetailItems($event)">
            <ion-item
              *ngFor="let control of detailControls; let index = index; trackBy: trackDetail"
              lines="none"
              class="km-entry-row podcast-segment__detail-row"
              [formGroupName]="index"
            >
              <div class="podcast-segment__detail-stack">
                <ion-textarea
                  class="podcast-segment__detail-textarea"
                  formControlName="text"
                  autoGrow="true"
                  rows="1"
                  [placeholder]="detailItemPlaceholder(index)"
                  [aria-label]="detailSectionTitle + ' ' + (index + 1)"
                ></ion-textarea>
                <div class="podcast-segment__detail-divider" aria-hidden="true"></div>
                <div
                  class="podcast-segment__detail-actions"
                  [class.podcast-segment__detail-actions--talking-points]="detailFormArrayName === 'talkingPoints'"
                >
                  <ng-container *ngIf="detailFormArrayName === 'talkingPoints'">
                    <span
                      class="podcast-segment__detail-owner"
                      [class.podcast-segment__detail-owner--empty]="!detailOwnerInitial(control)"
                      [attr.aria-label]="detailOwnerInitial(control) ? 'Assigned user initial ' + detailOwnerInitial(control) : null"
                      [attr.aria-hidden]="detailOwnerInitial(control) ? null : 'true'"
                    >
                      {{ detailOwnerInitial(control) ?? '' }}
                    </span>
                    <ion-button
                      *ngIf="detailDurationValue(control) as durationValue"
                      fill="clear"
                      size="small"
                      type="button"
                      class="podcast-segment__detail-duration"
                      [attr.aria-label]="'Cycle ' + detailItemLabel(index) + ' duration. Current duration ' + detailDurationLabel(control)"
                      (click)="cycleDetailDuration(control)"
                    >
                      <span class="podcast-segment__detail-duration-shell">
                        <ion-icon [icon]="icons.timeOutline"></ion-icon>
                        <span class="podcast-segment__detail-duration-badge">{{ durationValue }}</span>
                      </span>
                    </ion-button>
                  </ng-container>
                  <ion-button
                    fill="clear"
                    size="small"
                    type="button"
                    class="podcast-segment__detail-delete"
                    [attr.aria-label]="'Delete ' + detailItemLabel(index)"
                    (click)="deleteDetailItem(index)"
                  >
                    <ion-icon [icon]="icons.trashOutline" slot="icon-only"></ion-icon>
                  </ion-button>
                </div>
              </div>
            </ion-item>
          </ion-reorder-group>
        </div>

        <ion-button
          fill="clear"
          size="small"
          type="button"
          class="podcast-segment__add-point"
          (click)="addDetailItem()"
        >
          <ion-icon [icon]="icons.addOutline" slot="start"></ion-icon>
          {{ addDetailLabel }}
        </ion-button>
      </section>

    </form>
  </div>
</ion-content>

<ion-footer class="podcast-segment__footer" *ngIf="episode() && !loading() && !error() && segmentIndex() >= 0">
  <ion-toolbar class="podcast-segment__footer-bar">
    <div class="podcast-segment__footer-inner">
      <ion-button
        fill="clear"
        size="small"
        type="button"
        class="podcast-segment__footer-delete"
        (click)="deleteCurrentSegment()"
        [disabled]="saving()"
      >
        <ion-icon [icon]="icons.trashOutline" slot="start"></ion-icon>
        Delete Section
      </ion-button>
      <ion-button
        class="km-primary-btn podcast-segment__footer-save"
        size="small"
        type="button"
        (click)="saveSegment()"
        [disabled]="saving()"
      >
        <ion-icon [icon]="icons.checkmarkCircleOutline" slot="start"></ion-icon>
        {{ saving() ? 'Saving...' : 'Save' }}
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
