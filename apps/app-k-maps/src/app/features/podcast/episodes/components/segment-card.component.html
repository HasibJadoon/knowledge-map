<div class="segment-card">
  <span class="segment-card__order">{{ orderLabel }}</span>

  <h3>{{ title }}</h3>

  <div class="segment-card__meta" *ngIf="metadataItems.length">
    <span
      class="segment-card__meta-item"
      *ngFor="let item of metadataItems"
      [attr.aria-label]="item.ariaLabel"
    >
      <ion-icon [icon]="item.icon" aria-hidden="true"></ion-icon>
      <span *ngIf="item.value">{{ item.value }}</span>
    </span>
  </div>
</div>
