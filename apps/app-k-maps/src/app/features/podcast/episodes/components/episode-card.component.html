<button type="button" class="episode-card" (click)="selected.emit(episode.id)">
  <div class="episode-card__head">
    <div class="episode-card__title-wrap">
      <h2>{{ episode.title }}</h2>
      <p class="episode-card__summary">{{ summaryLine }}</p>
    </div>
    <span class="episode-card__chevron" aria-hidden="true">
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </span>
  </div>

  <div class="episode-card__footer">
    <div class="episode-card__badges">
      <app-status-badge [label]="typeLabel" [tone]="typeTone"></app-status-badge>
      <app-status-badge class="episode-card__status" [label]="statusLabel" [tone]="statusTone"></app-status-badge>
    </div>
    <p class="episode-card__time">
      <ion-icon name="create-outline" aria-hidden="true"></ion-icon>
      <span>{{ timeLine }}</span>
    </p>
  </div>
</button>
