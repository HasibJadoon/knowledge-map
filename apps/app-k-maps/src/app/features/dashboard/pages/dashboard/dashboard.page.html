<ion-header>
  <ion-toolbar class="dashboard-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
  <ion-toolbar class="dashboard-toolbar app-page-toolbar--search">
    <app-native-searchbar
      [value]="query()"
      placeholder="Search menu"
      [debounce]="0"
      (valueChange)="onSearchInput($event)"
    ></app-native-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-page">
  <div class="app-page-content app-page-content--wide dashboard-content">
    <ion-note class="app-page-summary">{{ searchSummary() }}</ion-note>

    <app-dashboard-card-grid [cards]="cards()" [emptyText]="emptyText()"></app-dashboard-card-grid>
  </div>
</ion-content>
