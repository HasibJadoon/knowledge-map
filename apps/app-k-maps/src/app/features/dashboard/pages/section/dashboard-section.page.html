<ion-header>
  <ion-toolbar class="dashboard-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ section()?.title || 'Menu' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" size="small" routerLink="/dashboard" routerDirection="root" aria-label="Dashboard">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-page">
  <ng-container *ngIf="section() as currentSection; else missingSection">
    <div class="dashboard-content ion-padding">
      <ion-card
        class="km-ion-card dashboard-section-hero"
        [class.dashboard-section-hero--sand]="currentSection.tone === 'sand'"
        [class.dashboard-section-hero--sky]="currentSection.tone === 'sky'"
        [class.dashboard-section-hero--mint]="currentSection.tone === 'mint'"
      >
        <ion-card-content>
          <ion-note class="dashboard-section-kicker">Dashboard Section</ion-note>
          <h1>{{ currentSection.title }}</h1>
          <p class="dashboard-section-subtitle">{{ currentSection.subtitle }}</p>

          <div class="dashboard-section-chips">
            <ion-chip class="dashboard-section-chip" outline="true">
              <ion-label>{{ currentSection.items.length }} {{ currentSection.items.length === 1 ? 'tool' : 'tools' }}</ion-label>
            </ion-chip>
            <ion-chip class="dashboard-section-chip" outline="true">
              <ion-label>{{ currentSection.tone | titlecase }}</ion-label>
            </ion-chip>
          </div>
        </ion-card-content>
      </ion-card>

      <section class="dashboard-section-grid">
        <app-dashboard-card-grid [cards]="cards()" emptyText="No tools."></app-dashboard-card-grid>
      </section>
    </div>
  </ng-container>

  <ng-template #missingSection>
    <div class="dashboard-content ion-padding">
      <ion-card class="km-ion-card dashboard-empty">
        <ion-card-content>
          <p>Menu section not found.</p>
        </ion-card-content>
      </ion-card>
    </div>
  </ng-template>
</ion-content>
