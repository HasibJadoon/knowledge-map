<ion-header class="study-toolbar-wrap">
  <ion-toolbar class="study-toolbar">
    <ion-title>Calendar</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" aria-label="New entry" (click)="openCreate()">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="study-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="prevWeek()" aria-label="Previous week">
        <ion-icon name="chevron-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title size="small" class="km-cal-week-title" (click)="goToday()">{{ weekLabel() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="nextWeek()" aria-label="Next week">
        <ion-icon name="chevron-forward-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="study-content" [fullscreen]="true">
  <div class="study-shell ion-padding km-planner-wrap">
    <ng-container *ngIf="loading(); else calendarLoaded">
      <section class="km-panel"><ion-skeleton-text animated style="width:100%;height:12rem"></ion-skeleton-text></section>
    </ng-container>

    <ng-template #calendarLoaded>
      <section class="km-panel km-subcard km-cal-day" *ngFor="let day of days()" [class.km-subcard--active]="day.isToday">
        <header class="km-cal-day-head">
          <span class="km-cal-day-name">{{ day.date | date:'EEEE d MMM':'UTC' }}</span>
          <ion-button fill="clear" size="small" class="km-cal-add" (click)="openCreate(day)" aria-label="Add">
            <ion-icon name="add-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </header>
        <ul class="km-cal-entries" *ngIf="day.entries.length > 0; else emptyDay">
          <li
            class="km-cal-entry"
            *ngFor="let entry of day.entries"
            [class.km-cal-entry--done]="entry.is_completed"
            (click)="complete(entry, $event)"
          >
            <span class="km-cal-entry-time">{{ entryTime(entry) }}</span>
            <span class="km-cal-entry-title">{{ entry.title }}</span>
            <ion-badge class="km-status-badge">{{ entryLabels[entry.entry_type] }}</ion-badge>
          </li>
        </ul>
        <ng-template #emptyDay><p class="km-empty-inline">No entries</p></ng-template>
      </section>
    </ng-template>
  </div>
</ion-content>

<ion-footer class="study-footer">
  <app-planner-bottom-nav active="calendar"></app-planner-bottom-nav>
</ion-footer>

<ion-modal class="km-source-metadata-modal" [isOpen]="createOpen()" (ionModalDidDismiss)="closeCreate()">
  <ng-template>
    <ion-header>
      <ion-toolbar class="study-toolbar">
        <ion-title>New Entry</ion-title>
        <ion-buttons slot="end"><ion-button fill="clear" (click)="closeCreate()">Close</ion-button></ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="study-content">
      <div class="study-shell ion-padding km-planner-wrap">
        <section class="km-panel km-panel--composer">
          <ion-item lines="none" class="km-form-field">
            <ion-input [formControl]="newTitle" label="Title" labelPlacement="stacked" placeholder="What's scheduled?"></ion-input>
          </ion-item>
          <ion-item lines="none" class="km-form-field">
            <ion-select label="Type" labelPlacement="stacked" [value]="newType()" (ionChange)="setNewType($event.detail.value)">
              <ion-select-option *ngFor="let type of entryTypes" [value]="type">{{ entryLabels[type] }}</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item lines="none" class="km-form-field">
            <ion-input type="date" [formControl]="newDate" label="Date" labelPlacement="stacked"></ion-input>
          </ion-item>
          <ion-item lines="none" class="km-form-field">
            <ion-input type="time" [formControl]="newTime" label="Time (optional)" labelPlacement="stacked"></ion-input>
          </ion-item>
          <ion-button class="km-btn km-primary-btn" expand="block" (click)="submitCreate()" [disabled]="saving()">
            {{ saving() ? 'Adding...' : 'Add Entry' }}
          </ion-button>
        </section>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
