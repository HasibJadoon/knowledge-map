<div class="study-shell ion-padding km-planner-wrap">
    <ng-container *ngIf="loading(); else episodesLoaded">
      <section class="km-panel">
        <ion-list class="km-entry-list">
          <ion-item class="km-entry-row" lines="none" *ngFor="let row of [1, 2, 3, 4, 5]">
            <ion-label>
              <h3><ion-skeleton-text animated style="width: 65%"></ion-skeleton-text></h3>
              <p><ion-skeleton-text animated style="width: 92%"></ion-skeleton-text></p>
            </ion-label>
          </ion-item>
        </ion-list>
      </section>
    </ng-container>

    <ng-template #episodesLoaded>
      <section class="km-panel" *ngIf="items().length > 0; else noEpisodes">
        <ion-list class="km-entry-list">
          <ion-item class="km-entry-row km-entry-row--action" button="true" detail="true" lines="none" *ngFor="let item of items()" (click)="openEpisode(item)">
            <ion-label>
              <h3>{{ item.title }}</h3>
              <p class="km-entry-meta">{{ episodeTopic(item) }}</p>
              <p class="km-entry-meta">{{ episodeSummary(item) }}</p>
              <p class="km-entry-time">{{ formatDate(item.updated_at ?? item.created_at) }}</p>
            </ion-label>
            <ion-badge class="km-status-badge" slot="end">{{ item.status | titlecase }}</ion-badge>
          </ion-item>
        </ion-list>
      </section>

      <ng-template #noEpisodes>
        <section class="km-panel km-empty-state">
          <h3>No episodes found</h3>
          <p>Episodes will show here when available.</p>
        </section>
      </ng-template>
    </ng-template>
</div>
