<section class="research-page">
  <header class="research-hero">
    <p class="research-hero__eyebrow">علوم</p>
    <h1>Quran Sciences</h1>
    <p>Core Quran sciences prepared as compact mobile research lanes.</p>
  </header>

  <label class="research-search" aria-label="Search Quran sciences">
    <span aria-hidden="true">⌕</span>
    <input type="search" placeholder="Search sciences..." [value]="searchTerm()" (input)="setSearch($any($event.target).value)" />
  </label>

  <div class="source-list">
    @for (source of sources(); track source.title) {
      <article class="source-card">
        <div class="source-card__icon" aria-hidden="true">{{ source.icon }}</div>
        <div>
          <h2>{{ source.title }}</h2>
          <p>{{ source.description }}</p>
          <span>{{ source.topicCount }}</span>
        </div>
      </article>
    }
  </div>
</section>
