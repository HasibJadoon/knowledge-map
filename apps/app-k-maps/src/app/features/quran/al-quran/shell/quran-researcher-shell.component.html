<ion-header class="qrs-header" [translucent]="false">
  <ion-toolbar class="qrs-toolbar">
    <ion-buttons slot="start">
      <ion-button aria-label="Home" (click)="goHome()">
        <span class="qrs-grid-icon" aria-hidden="true">▦</span>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <span class="qrs-title">K-MAPS</span>
      <span class="qrs-subtitle">Quran Researcher</span>
    </ion-title>
  </ion-toolbar>

  <ion-toolbar class="qrs-tabs-toolbar">
    <nav class="qrs-tabs" aria-label="Quran researcher tabs">
      @for (tab of tabs; track tab.id) {
        <a
          class="qrs-tab"
          [routerLink]="['/quran', tab.routePath]"
          routerLinkActive="qrs-tab--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="qrs-tab__icon" aria-hidden="true">{{ tab.icon }}</span>
          <span class="qrs-tab__arabic">{{ tab.labelAr }}</span>
          <span class="qrs-tab__label">{{ tab.label }}</span>
        </a>
      }
    </nav>
  </ion-toolbar>
</ion-header>

<ion-content class="qrs-content" [fullscreen]="true">
  <router-outlet />
</ion-content>
