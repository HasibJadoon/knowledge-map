<article class="quran-reading-page" [attr.aria-label]="page.meta.pageLabel">
  <div class="quran-reading-page__surface">
    <div class="quran-reading-page__frame">
      <div class="quran-reading-page__passage" *ngIf="passageSections.length; else noPassage" dir="rtl" lang="ar" translate="no">
        <section
          *ngFor="let section of passageSections; trackBy: trackBySection"
          class="quran-reading-page__section"
        >
          <p class="quran-reading-page__section-title" *ngIf="section.heading">{{ section.heading }}</p>
          <p class="quran-reading-page__section-basmallah" *ngIf="section.basmallah">{{ section.basmallah }}</p>
          <p class="quran-reading-page__section-text" *ngIf="section.verses.length">
            <ng-container *ngFor="let verse of section.verses; trackBy: trackByVerse">
              <ng-container *ngIf="verse.words.length; else plainVerseText">
                <ng-container *ngFor="let word of verse.words; trackBy: trackByWord">
                  <span
                    class="quran-reading-page__word"
                    appLongPress
                    (appLongPress)="openTargetMenu($event, verse, word)"
                  >{{ word.text }}</span>{{ ' ' }}
                </ng-container>
              </ng-container>
              <ng-template #plainVerseText>
                <span
                  class="quran-reading-page__verse-text"
                  appLongPress
                  (appLongPress)="openTargetMenu($event, verse)"
                >{{ verse.text }}</span>{{ ' ' }}
              </ng-template>
              <span
                class="quran-reading-page__marker"
                *ngIf="verse.marker"
                appLongPress
                (appLongPress)="openTargetMenu($event, verse)"
              >{{ verse.marker }}</span>
              <span> </span>
            </ng-container>
          </p>
        </section>
      </div>

      <ng-template #noPassage>
        <p class="quran-reading-page__fallback-empty">No renderable text is available for this page.</p>
      </ng-template>

      <footer class="quran-reading-page__page-end" aria-label="Page number">
        <span class="quran-reading-page__page-end-line" aria-hidden="true"></span>
        <span class="quran-reading-page__page-end-badge" [attr.aria-label]="page.meta.pageLabel">
          <span class="quran-reading-page__page-end-number">{{ pageNumberLabel }}</span>
        </span>
        <span class="quran-reading-page__page-end-line" aria-hidden="true"></span>
      </footer>
    </div>
  </div>
</article>
