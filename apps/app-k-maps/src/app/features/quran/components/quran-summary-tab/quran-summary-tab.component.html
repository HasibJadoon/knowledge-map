<ion-card class="quran-browse__hero quran-browse__card">
  <ion-card-content>
    <p class="quran-browse__eyebrow">Browse Index</p>
    <h1>Quran</h1>
    <p class="quran-browse__summary">
      Browse the Quran by Surah or Juz' from a single index view.
    </p>

    <div class="quran-browse__stats">
      <article class="quran-browse__stat">
        <span class="quran-browse__stat-value">{{ totalPages }}</span>
        <span class="quran-browse__stat-label">Pages</span>
      </article>
      <article class="quran-browse__stat">
        <span class="quran-browse__stat-value">{{ totalSurahs }}</span>
        <span class="quran-browse__stat-label">Surahs</span>
      </article>
      <article class="quran-browse__stat">
        <span class="quran-browse__stat-value">{{ totalJuzs }}</span>
        <span class="quran-browse__stat-label">Juz'</span>
      </article>
    </div>
  </ion-card-content>
</ion-card>
