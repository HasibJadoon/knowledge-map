<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding targeted-notes-modal-content">
  <p class="targeted-notes-modal-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  <app-targeted-notes-block
    [target]="target"
    [placeholder]="placeholder"
  ></app-targeted-notes-block>
</ion-content>
