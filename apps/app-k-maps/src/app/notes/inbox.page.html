<ion-header>
  <ion-toolbar class="notes-shell-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Notes</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" size="small" routerLink="/dashboard" routerDirection="root" aria-label="Dashboard">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="notes-shell-search">
    <div class="notes-search-row">
      <ion-searchbar
        [formControl]="searchControl"
        placeholder="Search notes"
        show-clear-button="focus"
        [debounce]="0"
      ></ion-searchbar>
    </div>
  </ion-toolbar>
</ion-header>

<ion-router-outlet></ion-router-outlet>

<ion-footer class="notes-tabs__footer ion-no-border" *ngIf="showFooterTabs">
  <app-icon-tabs
    class="notes-tabs__bar"
    [tabs]="noteTabs"
    [activeKey]="activeTabKey()"
    [manual]="true"
    (tabSelected)="onTabSelected($event)"
  ></app-icon-tabs>
</ion-footer>
