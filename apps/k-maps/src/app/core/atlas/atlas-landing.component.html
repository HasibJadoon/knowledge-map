<div class="atlas" #host>
  <svg #svgRoot class="atlas__canvas"></svg>

  <div class="atlas__edge-words atlas__edge-words--top" aria-hidden="true">
    <span
      *ngFor="let word of edgeWordCloud.top"
      class="atlas__edge-word"
      [style.left.%]="word.offset"
      [style.fontSize.px]="word.size"
      [style.opacity]="word.alpha"
      [style.animationDelay.s]="-word.delay"
      [style.--atlas-word-rotate]="word.tilt + 'deg'">
      {{ word.text }}
    </span>
  </div>

  <div class="atlas__edge-words atlas__edge-words--right" aria-hidden="true">
    <span
      *ngFor="let word of edgeWordCloud.right"
      class="atlas__edge-word"
      [style.top.%]="word.offset"
      [style.fontSize.px]="word.size"
      [style.opacity]="word.alpha"
      [style.animationDelay.s]="-word.delay"
      [style.--atlas-word-rotate]="word.tilt + 'deg'">
      {{ word.text }}
    </span>
  </div>

  <div class="atlas__edge-words atlas__edge-words--bottom" aria-hidden="true">
    <span
      *ngFor="let word of edgeWordCloud.bottom"
      class="atlas__edge-word"
      [style.left.%]="word.offset"
      [style.fontSize.px]="word.size"
      [style.opacity]="word.alpha"
      [style.animationDelay.s]="-word.delay"
      [style.--atlas-word-rotate]="word.tilt + 'deg'">
      {{ word.text }}
    </span>
  </div>

  <div class="atlas__edge-words atlas__edge-words--left" aria-hidden="true">
    <span
      *ngFor="let word of edgeWordCloud.left"
      class="atlas__edge-word"
      [style.top.%]="word.offset"
      [style.fontSize.px]="word.size"
      [style.opacity]="word.alpha"
      [style.animationDelay.s]="-word.delay"
      [style.--atlas-word-rotate]="word.tilt + 'deg'">
      {{ word.text }}
    </span>
  </div>

  <button #homePlaneButton class="atlas__home-plane" type="button" aria-label="Enter home" (click)="launchHome()">
    <span class="atlas__home-plane-ring"></span>
    <span class="atlas__home-plane-glow"></span>

    <svg class="atlas__home-plane-icon" viewBox="0 0 72 72" aria-hidden="true">
      <path class="atlas__plane-trail" d="M 10 49 C 22 44, 30 36, 36 24" />
      <g class="atlas__home-plane-ship">
        <path class="atlas__plane-body" d="M 14 40 L 58 14 L 37 57 L 30 42 Z" />
        <path class="atlas__plane-wing" d="M 14 40 L 58 14 L 33 32 Z" />
        <path class="atlas__plane-fold" d="M 30 42 L 37 57 L 33 32 Z" />
      </g>
    </svg>
  </button>
</div>
