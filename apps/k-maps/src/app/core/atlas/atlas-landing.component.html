<div class="atlas" #host>
  <div class="atlas__star-stage" aria-hidden="true">
    <div #starHost class="atlas__star-webgl"></div>
  </div>

  @for (side of edgeWordSides; track side) {
    <div class="atlas__edge-words" [class]="'atlas__edge-words atlas__edge-words--' + side" aria-hidden="true">
      @for (word of edgeWords[side]; track word.text) {
        <span
          class="atlas__edge-word"
          [style.fontSize.px]="word.size"
          [style.opacity]="word.alpha"
          [style.--atlas-word-rotate]="word.tilt + 'deg'"
          [attr.data-side]="side"
          [attr.data-delay]="word.delay"
          [attr.data-tilt]="word.tilt"
          [style.left.%]="side === 'top' || side === 'bottom' ? word.offset : null"
          [style.top.%]="side === 'left' || side === 'right' ? word.offset : null"
        >
          {{ word.text }}
        </span>
      }
    </div>
  }

  <div class="atlas__fire-stage" aria-hidden="true">
    <div #fireHost class="atlas__fire-webgl"></div>
  </div>

  <svg #svgRoot class="atlas__canvas"></svg>

  <div class="atlas__zoom-controls" aria-label="Zoom controls">
    <button class="atlas__zoom-button" type="button" aria-label="Zoom in" (click)="zoomIn()">+</button>
    <button class="atlas__zoom-button" type="button" aria-label="Zoom out" (click)="zoomOut()">−</button>
    <button class="atlas__zoom-button atlas__zoom-button--reset" type="button" aria-label="Reset view" (click)="resetZoom()">◎</button>
  </div>

  <button #homePlaneButton class="atlas__home-plane" type="button" aria-label="Enter home" (click)="launchHome()">
    <span class="atlas__home-plane-aura"></span>
    <span class="atlas__home-plane-orbit atlas__home-plane-orbit--outer"></span>
    <span class="atlas__home-plane-shell"></span>
    <span class="atlas__home-plane-world"></span>
    <span class="atlas__home-plane-continents"></span>
    <span class="atlas__home-plane-clouds"></span>
    <span class="atlas__home-plane-atmosphere"></span>
    <span class="atlas__home-plane-glint"></span>
    <span class="atlas__home-plane-glow"></span>
    <span class="atlas__home-plane-shadow"></span>

    <svg class="atlas__home-plane-icon" viewBox="0 0 72 72" aria-hidden="true">
      <path class="atlas__plane-trail" d="M 10 49 C 22 44, 30 36, 36 24" />
      <g class="atlas__home-plane-ship">
        <path class="atlas__plane-body" d="M 14 40 L 58 14 L 37 57 L 30 42 Z" />
        <path class="atlas__plane-wing" d="M 14 40 L 58 14 L 33 32 Z" />
        <path class="atlas__plane-fold" d="M 30 42 L 37 57 L 33 32 Z" />
      </g>
    </svg>
  </button>
</div>
