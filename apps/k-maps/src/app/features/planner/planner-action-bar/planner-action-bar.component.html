<div class="planner-action-bar">
  <button type="button" (click)="pushToFeed.emit()" [disabled]="busy">Push to Feed</button>
  <button type="button" (click)="pushToKanban.emit()" [disabled]="busy">Push to Kanban</button>
  <button type="button" (click)="saveDraft.emit()" [disabled]="busy">Save Draft</button>
  <button type="button" (click)="archive.emit()" [disabled]="busy">Archive</button>
</div>
