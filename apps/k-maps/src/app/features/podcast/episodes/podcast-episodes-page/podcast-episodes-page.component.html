<section class="podcast-library-page">
  <app-headerbar
    class="podcast-library-header"
    [showTitle]="true"
    [title]="sourceFilter === 'worldview' ? 'Generated Podcast Drafts' : 'Podcast Episodes'"
    [showSearch]="true"
    [placeholder]="'Search title, source, or topic'"
    [value]="q"
    [primaryLabel]="'New'"
    (search)="onHeaderSearchInput($event)"
    (primary)="openNewEpisode()"
  />

  <div class="podcast-library-intro">
    <div class="podcast-library-kicker">Podcast Library</div>
    <h2>Generated drafts and manual episodes in one place.</h2>
    <p>
      Open the worldview-generated episodes directly, or browse the full library when you need the wider production queue.
    </p>
  </div>

  <div class="podcast-library-filters">
    <button
      class="filter-pill"
      type="button"
      [class.is-active]="sourceFilter === 'all'"
      (click)="setSourceFilter('all')"
    >
      All Episodes
    </button>
    <button
      class="filter-pill"
      type="button"
      [class.is-active]="sourceFilter === 'worldview'"
      (click)="setSourceFilter('worldview')"
    >
      Generated from Worldview
    </button>
  </div>

  <div *ngIf="loading" class="podcast-library-state">Loading podcast episodes…</div>
  <div *ngIf="!loading && error" class="podcast-library-state podcast-library-state--error">{{ error }}</div>
  <div *ngIf="!loading && !error && sections.length === 0" class="podcast-library-state">
    No podcast episodes matched this view.
  </div>

  <app-menu-cards
    *ngIf="!loading && !error && sections.length"
    [sections]="sections"
    (cardSelect)="onCardSelect($event)"
  ></app-menu-cards>
</section>
