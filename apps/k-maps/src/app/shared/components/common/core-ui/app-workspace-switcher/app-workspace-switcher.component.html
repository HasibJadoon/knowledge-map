<c-dropdown
  *ngIf="ws.workspaces().length"
  [popperOptions]="{ placement: 'bottom-end', strategy: 'fixed' }"
  autoClose="outside"
  class="ws-switcher-host"
>
  <button [caret]="false" cDropdownToggle class="ws-toggle" aria-label="Switch workspace">
    <span class="ws-icon">{{ typeIcon(ws.active()?.workspace_type ?? '') }}</span>
    <span class="ws-name">{{ ws.active()?.title ?? 'Workspace' }}</span>
    <span class="ws-caret" aria-hidden="true">▾</span>
  </button>

  <ul cDropdownMenu class="ws-menu">
    <li class="ws-menu-label">Switch workspace</li>
    <li
      *ngFor="let w of ws.workspaces()"
      class="ws-menu-item"
      [class.ws-menu-item--active]="ws.active()?.id === w.id"
      (click)="select(w)"
      (keydown.enter)="select(w)"
      (keydown.space)="select(w)"
      tabindex="0"
      role="option"
      [attr.aria-selected]="ws.active()?.id === w.id"
    >
      <span class="ws-item-icon">{{ typeIcon(w.workspace_type) }}</span>
      <span class="ws-item-body">
        <span class="ws-item-title">{{ w.title }}</span>
        <span class="ws-item-role">{{ w.membership_role }}</span>
      </span>
      <span *ngIf="ws.active()?.id === w.id" class="ws-item-check" aria-hidden="true">✓</span>
    </li>
  </ul>
</c-dropdown>
