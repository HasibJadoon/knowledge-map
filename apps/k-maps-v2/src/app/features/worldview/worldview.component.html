<div class="km-page" #page>

  <!-- Back Button -->
  <a class="km-back-btn" [routerLink]="['/landing']">
    <span class="km-back-btn__arrow">←</span>
    <span class="km-back-btn__label">Home</span>
  </a>

  <div class="km-page__inner">

    <!-- Header -->
    <header class="km-page-header">
      <p class="km-page-header__eyebrow">Knowledge System</p>
      <h1 class="km-page-header__title">Worldview</h1>
      <p class="km-page-header__subtitle">Sources → Insights → Framework</p>
      <div class="km-page-header__rule"></div>
    </header>

    <!-- Pipeline Tags -->
    <div class="km-pipeline-tags">
      <span class="km-pipeline-tag km-pipeline-tag--sources">Sources</span>
      <span class="km-pipeline-tag__sep">→</span>
      <span class="km-pipeline-tag km-pipeline-tag--insights">Insights</span>
      <span class="km-pipeline-tag__sep">→</span>
      <span class="km-pipeline-tag km-pipeline-tag--framework">Framework</span>
    </div>

    <!-- Cards Grid -->
    <div class="km-grid">
      @for (section of sections; track section.label) {
        <div class="km-card" [attr.data-stage]="section.tag">
          <div class="km-card__tag">{{ section.tag }}</div>
          <div class="km-card__icon">{{ section.icon }}</div>
          <h3 class="km-card__title">{{ section.label }}</h3>
          <p class="km-card__desc">{{ section.desc }}</p>
          <div class="km-card__arrow">→</div>
        </div>
      }
    </div>

  </div>
</div>
