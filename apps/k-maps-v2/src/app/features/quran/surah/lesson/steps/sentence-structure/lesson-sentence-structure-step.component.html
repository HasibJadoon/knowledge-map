<div class="sst">
  <ng-container *ngIf="sentences.length > 0; else emptyState">

    <header class="sst__header">
      <div>
        <span class="sst__eyebrow">Sentence Structure</span>
        <h2 class="sst__title">{{ taskTitle }}</h2>
      </div>

      <div class="sst__sentence-nav" *ngIf="sentences.length > 1">
        <span class="sst__sentence-nav-progress">
          {{ selectedSentenceIndex + 1 }} / {{ sentences.length }}
        </span>
        <button
          type="button"
          class="sst__sentence-nav-btn"
          *ngIf="selectedSentenceIndex < sentences.length - 1"
          (click)="selectSentence(selectedSentenceIndex + 1)"
        >
          <span class="sst__sentence-nav-label">Next Sentence</span>
          <span class="sst__sentence-nav-arrow" aria-hidden="true">&#8594;</span>
        </button>
      </div>
    </header>

    <km-sentence-structure-canvas [treebank]="canvasTreebank" />

  </ng-container>

  <ng-template #emptyState>
    <div class="sst__empty" *ngIf="hasTaskPayload; else noTask">
      <span class="sst__empty-icon">~</span>
      <p class="sst__empty-title">Sentence payload found, but no renderable tree is ready yet.</p>
    </div>
  </ng-template>

  <ng-template #noTask>
    <div class="sst__empty">
      <span class="sst__empty-icon">-</span>
      <p class="sst__empty-title">No sentence structure task for this passage.</p>
    </div>
  </ng-template>
</div>
