<div class="sst">

  @if (hasSentences) {

    <!-- Sentence navigation (only shown when multiple children trees exist) -->
    @if (sentences.length > 1) {
      <div class="sst__nav">
        @for (s of sentences; track $index) {
          <button
            type="button"
            class="sst__nav-btn"
            [class.sst__nav-btn--active]="$index === selectedIdx"
            (click)="selectSentence($index)"
          >{{ $index + 1 }}</button>
        }
      </div>
    }

    <!-- D3 collapsible tree — full width -->
    <div class="sst__canvas">
      <km-sentence-structure-canvas
        [treeData]="currentTree"
        [termColors]="currentColors"
      />
    </div>

    <p class="sst__hint">Click a node to expand / collapse</p>

  } @else if (hasTask) {

    <div class="sst__empty">
      <span class="sst__empty-icon">~</span>
      <p>No tree data attached to this task yet.</p>
    </div>

  } @else {

    <div class="sst__empty">
      <span class="sst__empty-icon">-</span>
      <p>No sentence structure task for this passage.</p>
    </div>

  }

</div>
