<div class="arabic-home" #pageRef>

  <div class="arabic-home__inner">

    <nav class="top-nav">
      <button class="back-btn" (click)="back()">
        <span class="back-btn__arrow">&#8592;</span>
        <span class="back-btn__label">K-Maps</span>
      </button>
      <span class="breadcrumb">Arabic</span>
    </nav>

    <header class="page-header">
      <div class="page-header__ornament">&#10023;</div>
      <h1 class="page-header__title">Arabic</h1>
      <p class="page-header__subtitle">Roots · Lexicon · Library · Grammar</p>
    </header>

    <div class="sections-grid" #cardsRef>
      @for (section of sections; track section.route) {
        <a class="section-card" [routerLink]="section.route">
          <div class="section-card__arabic-bg">{{ section.arabicLabel }}</div>
          <div class="section-card__icon">{{ section.icon }}</div>
          <div class="section-card__content">
            <h2 class="section-card__label">{{ section.label }}</h2>
            <p class="section-card__desc">{{ section.desc }}</p>
          </div>
          <div class="section-card__arabic">{{ section.arabicLabel }}</div>
          <div class="section-card__arrow">&#8594;</div>
        </a>
      }
    </div>

  </div>

</div>
