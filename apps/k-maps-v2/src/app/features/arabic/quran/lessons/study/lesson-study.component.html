<div class="lesson-study">

  <div class="lesson-study__inner">

    <!-- Navigation -->
    <nav class="top-nav">
      <button class="back-btn" (click)="back()">
        <span class="back-btn__arrow">&#8592;</span>
        <span class="back-btn__label">Quran</span>
      </button>
      <span class="breadcrumb">Lesson {{ lessonId() }}</span>
    </nav>

    <!-- Header -->
    <header class="page-header">
      <div class="page-header__label">Lesson Study</div>
      <h1 class="page-header__title">Lesson {{ lessonId() }}</h1>
    </header>

    <!-- Tab Bar -->
    <div class="tab-bar-wrap">
      <div class="tab-bar">
        @for (tab of tabs; track tab.id) {
          <button
            class="tab-pill"
            [class.tab-pill--active]="activeTab() === tab.id"
            (click)="setTab(tab.id)"
          >{{ tab.label }}</button>
        }
      </div>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
      @for (tab of tabs; track tab.id) {
        @if (activeTab() === tab.id) {
          <div class="tab-panel">
            <div class="tab-panel__placeholder">
              <div class="tab-panel__badge">{{ tab.label }}</div>
              <p class="tab-panel__message">Tab content coming soon</p>
              <p class="tab-panel__sub">
                The <strong>{{ tab.label }}</strong> module is under active development
              </p>
            </div>
          </div>
        }
      }
    </div>

  </div>

</div>
