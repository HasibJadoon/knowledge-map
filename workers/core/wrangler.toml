name = "km-core-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = false   # internal only — accessed via km-backend-worker service binding

[[d1_databases]]
binding = "DB_CORE"
database_name = "km_core"
database_id = "afe84ce7-04dd-45a1-99ac-f42ca53276d2"
migrations_dir = "migrations"

[vars]
JWT_EXPIRY_SECONDS = "3600"

# OAuth (optional) — set these to enable social sign-in. Each provider is
# reported as disabled by /core/auth/providers until its vars are present,
# so the login screen only shows buttons that will actually work.
# Client IDs are not secret; add them here (comma-separated for multiple
# audiences, e.g. an Apple services-id plus a native bundle-id):
#   GOOGLE_CLIENT_ID   = "xxxx.apps.googleusercontent.com"
#   APPLE_CLIENT_ID    = "com.kmaps.web"
#   APPLE_REDIRECT_URI = "https://app.k-maps.com/login"

# Secrets (set via wrangler secret put):
#   JWT_SECRET      — shared with km-backend-worker
#   INTERNAL_SECRET — shared with km-backend-worker
