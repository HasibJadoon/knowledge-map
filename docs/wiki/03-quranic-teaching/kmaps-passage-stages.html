<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passage Stages — al-Dukhān 44:1–9</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Amiri:wght@700&display=swap');
  :root{
    --bg:#080808; --s1c:#141414; --s2c:#1a1a1a;
    --gold:#c9a84c; --gold-b:#e8c96a; --gold-d:#7a6432; --bd:rgba(201,168,76,.28); --bd-hi:rgba(201,168,76,.6);
    --text:#f3e7d1; --t2:#c9b79a; --t3:#8a7b68; --arab:#f8eeda;
    --reading:#e8c96a; --morph:#4dd9a8; --ss:#6bbaff; --expr:#ff7bac; --struct:#a0e060; --tafsir:#c084f5; --srs:#ff9f6b; --result:#f1591f;
    --serif:'Cinzel',Georgia,serif; --ar:'Amiri','Scheherazade New','Noto Naskh Arabic','Geeza Pro',serif;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%; overflow-x:hidden}
  body{margin:0; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
    background:radial-gradient(1100px 560px at 50% -160px,#171308,var(--bg) 60%); background-attachment:fixed; min-height:100vh; padding:0 16px 70px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px; margin:0 auto}
  .ar{font-family:var(--ar); color:var(--arab)}
  h1{font-family:var(--serif); font-weight:700; font-size:clamp(23px,4.4vw,32px); text-align:center; color:var(--gold-b); margin:32px 0 4px; text-shadow:0 0 26px rgba(201,168,76,.12)}
  .sub{text-align:center; color:var(--t2); font-size:14px; margin:0 0 6px}
  .sub .ar{font-size:1.2em; color:var(--gold)}

  /* pages / router */
  .page{display:none}
  .page.active{display:block; animation:fwd .32s ease}
  .page.active.back{animation:bwd .32s ease}
  @keyframes fwd{from{opacity:0; transform:translateX(20px)}}
  @keyframes bwd{from{opacity:0; transform:translateX(-20px)}}

  /* ---- linear 3D stage rail (home) ---- */
  /* S-shape serpentine rail */
  .rail-s{position:relative; margin:24px 0 8px; padding:8px 0}
  .s-line{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
  .s-row{display:flex; position:relative; z-index:1}
  .s-row.top{justify-content:flex-start}
  .s-row.bot{justify-content:flex-end; margin-top:30px}
  .s-row .stage{flex:0 0 25%; display:flex; flex-direction:column; align-items:center; position:relative; padding:0 8px}
  /* mobile: drop the S-line, wrap into a 3-per-row grid that fits any width */
  @media(max-width:640px){
    .s-line{display:none}
    .s-row{flex-wrap:wrap; justify-content:center !important; gap:14px 0; margin-top:0 !important}
    .s-row.bot{margin-top:14px !important}
    .s-row .stage{flex:0 0 33.33%; padding:0 5px}
  }
  .orb{width:74px; height:74px; border-radius:50%; position:relative; z-index:2; cursor:pointer;
    display:flex; align-items:center; justify-content:center; border:2px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.12) inset, 0 -8px 14px rgba(0,0,0,.35) inset; transition:transform .18s, box-shadow .18s}
  .orb::before{content:''; position:absolute; top:9px; left:16px; width:30px; height:20px; border-radius:50%; background:radial-gradient(closest-side, rgba(255,255,255,.55), transparent); filter:blur(1px)}
  .orb:hover{transform:translateY(-5px); box-shadow:0 16px 30px rgba(0,0,0,.6), 0 0 24px var(--glowc), 0 2px 0 rgba(255,255,255,.14) inset}
  .orb svg{width:34px; height:34px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .orb .num{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:#0c0c0c; border:2px solid var(--bd-hi); font-family:var(--serif); font-size:11px; color:var(--gold-b); display:flex; align-items:center; justify-content:center; z-index:3}
  .snap{font-size:12px; font-weight:600; color:var(--t2); margin-top:12px; text-align:center; line-height:1.2}
  .snap .a{display:block; font-family:var(--ar); color:var(--t3); font-size:12px}
  .pbar{width:60px; height:5px; border-radius:4px; background:#222; margin-top:6px; overflow:hidden}
  .pbar i{display:block; height:100%; border-radius:4px}
  .fb{width:100%; height:150px; margin-top:2px; min-width:760px; display:block}
  .fb text{font-family:var(--serif); font-size:11px; letter-spacing:.05em}
  .hint{text-align:center; color:var(--t3); font-size:12.5px; margin-top:16px}
  .foot{text-align:center; color:var(--t3); font-size:12px; margin-top:8px; font-family:var(--serif); letter-spacing:.04em}

  /* ---- stage page ---- */
  .topbar{display:flex; align-items:center; gap:12px; padding:22px 0 4px; flex-wrap:wrap}
  .backbtn{border:1px solid var(--bd); background:var(--s1c); color:var(--text); font:inherit; font-weight:600; font-size:13.5px; padding:7px 14px; border-radius:20px; cursor:pointer}
  .backbtn:hover{border-color:var(--bd-hi)}
  .crumb{font-size:13px; color:var(--t3)} .crumb b{color:var(--t2)}
  .card{border:1px solid var(--bd); border-radius:18px; background:linear-gradient(180deg,var(--s1c),#0d0d0d); padding:22px 24px 24px; box-shadow:0 14px 40px rgba(0,0,0,.5); margin-top:10px}
  .dhead{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .dorb{width:60px; height:60px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; border:2px solid rgba(255,255,255,.14); box-shadow:0 8px 16px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.15) inset}
  .dorb svg{width:30px; height:30px}
  .dttl{flex:1; min-width:180px}
  .dttl .k{font-family:var(--serif); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-d)}
  .dttl h2{font-family:var(--serif); margin:2px 0 0; font-size:24px; color:var(--gold-b)}
  .dttl h2 .ar{font-size:.92em; color:var(--t2); margin-left:8px; font-weight:400}
  .badge{font-family:var(--serif); font-size:12px; font-weight:600; color:#0c0c0c; padding:6px 14px; border-radius:20px}
  .ddesc{font-size:14.5px; color:var(--t2); line-height:1.55; margin:14px 0 2px}
  .dstat{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 4px}
  .dstat .c{background:var(--s2c); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:9px 14px; text-align:center}
  .dstat .c b{font-family:var(--serif); font-size:19px; display:block} .dstat .c span{font-size:11px; color:var(--t3)}
  /* per-stage feedback loop strip */
  .loopstrip{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:16px 0 2px; padding:12px 14px; background:var(--s2c); border:1px solid rgba(255,255,255,.06); border-radius:14px}
  .lchip{background:#0f0f0f; border:1px solid rgba(255,255,255,.09); border-radius:20px; padding:5px 12px; font-size:12.5px; color:var(--t2)}
  .lchip.fbk{border-color:var(--bd-hi); color:var(--gold-b); font-weight:600}
  .loopstrip .arr{color:var(--gold-d); font-weight:700}
  .fbnote{border-left:3px solid var(--gold); background:rgba(201,168,76,.05); padding:9px 14px; border-radius:0 10px 10px 0; margin:12px 0 2px; font-size:13.5px; color:var(--t2)}
  .fbnote b{color:var(--gold-b)}
  .clabel{font-family:var(--serif); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-d); margin:20px 0 10px}

  .rootgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:10px}
  .rcard{background:linear-gradient(180deg,#191919,#111); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:12px; position:relative; box-shadow:0 6px 14px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05) inset; transition:transform .15s, border-color .15s}
  .rcard:hover{transform:translateY(-3px); border-color:var(--bd-hi)}
  .rcard .rar{font-family:var(--ar); font-size:26px; font-weight:700; text-align:center; color:var(--arab); line-height:1.1}
  .rcard .rbk{font-size:11px; color:var(--t3); text-align:center; margin-top:3px; font-variant-numeric:tabular-nums}
  .rcard .rb{height:6px; border-radius:4px; background:#262626; margin-top:8px; overflow:hidden}
  .rcard .rb i{display:block; height:100%; border-radius:4px}
  .rcard .rst{position:absolute; top:8px; right:9px; font-size:9px; font-weight:800; letter-spacing:.05em; text-transform:uppercase}
  .rcard.done{border-color:rgba(77,217,168,.4)} .rcard.done .rar{color:#8ff0cf} .rcard.done .rst{color:var(--morph)}
  .rcard.active{border-color:rgba(232,201,106,.55)} .rcard.active .rst{color:var(--gold-b)}
  .rcard.q .rst{color:var(--t3)}
  .rcard.verb{border-left:3px solid var(--gold)} .rcard.verb .rst{color:var(--gold-b)}
  .rcard.noun{border-left:3px solid var(--morph)} .rcard.noun .rst{color:var(--morph)}
  .rcard.clickable{cursor:pointer}
  /* restore outer box per stage */
  .stagebody{border:1px solid var(--bd-hi); background:linear-gradient(180deg,var(--s1c),#0d0d0d); padding:22px 24px 24px; margin-top:10px; box-shadow:9px 9px 0 rgba(0,0,0,.45), inset 2px 2px 0 rgba(255,255,255,.06), inset -3px -3px 0 rgba(0,0,0,.55)}
  /* sentence-structure + structure cards */
  .sscard{background:linear-gradient(180deg,#171717,#0f0f0f); border:1px solid rgba(255,255,255,.06); border-left:3px solid var(--ss); padding:13px 15px; margin-bottom:9px; box-shadow:5px 5px 0 rgba(0,0,0,.4)}
  .sscard.anchor{border-left-color:var(--reading)}
  .ss-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .ss-no{width:24px; height:24px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:var(--ss); color:#0c0c0c; font-family:var(--serif); font-weight:700; font-size:12px}
  .ss-ay{font-family:var(--serif); color:var(--gold-b); font-size:13px; font-variant-numeric:tabular-nums}
  .ss-kind{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border:1px solid rgba(255,255,255,.1)}
  .ss-kind.nominal{color:var(--morph)} .ss-kind.verbal{color:var(--gold-b)} .ss-kind.virtual_muqaddar{color:var(--srs)}
  .ss-role{font-size:12.5px; color:var(--t2)}
  .ss-ar{font-family:var(--ar); font-size:25px; color:var(--arab); direction:rtl; text-align:right; line-height:1.9; margin:8px 0 6px}
  .ss-label{font-size:14px; color:var(--text); margin-top:6px}
  .ss-cl{display:flex; flex-wrap:wrap; gap:6px}
  .clause{font-size:11.5px; color:var(--t2); border:1px solid rgba(255,255,255,.09); padding:3px 9px; background:#0e0e0e}
  .clause b{color:var(--ss); text-transform:capitalize} .clause .ar{font-size:13px; color:var(--arab)} .clause i{color:var(--srs)}
  /* root detail: layers + membean memlet */
  .rootdetail-head{display:flex; align-items:center; gap:16px; margin:6px 0 2px}
  .rd-root{font-family:var(--ar); font-size:44px; color:var(--gold-b); line-height:1}
  .rd-meta{color:var(--t2); font-size:13px}
  .layerlist .lrow{display:flex; align-items:center; gap:11px; padding:10px 2px; border-top:1px solid rgba(201,168,76,.1); font-size:14px}
  .layerlist .lrow:first-child{border-top:0}
  .lrow .ld{width:20px; height:20px; flex:0 0 auto; border:1px solid var(--bd); display:flex; align-items:center; justify-content:center; font-size:11px; color:#0c0c0c}
  .lrow.built .ld{background:var(--morph); border-color:var(--morph)}
  .lrow .lst{margin-left:auto; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em}
  .lrow.built .lst{color:var(--morph)} .lrow.pend .lst{color:var(--t3)}
  .memlet{display:flex; gap:16px; flex-wrap:wrap; background:linear-gradient(180deg,#151310,#0d0b09); border:1px solid rgba(201,168,76,.22); padding:16px; box-shadow:5px 5px 0 rgba(0,0,0,.4)}
  .memlet-art{width:118px; height:118px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--bd); background:#0e0e0e; font-size:50px}
  .memlet-art .cap{font-size:9px; color:var(--t3); text-transform:uppercase; letter-spacing:.1em; margin-top:8px; font-family:var(--serif)}
  .memlet-body{flex:1; min-width:220px}
  .memlet-word{font-family:var(--ar); font-size:32px; color:var(--gold-b)}
  .memlet-word .tr{font-family:var(--serif); font-size:12px; color:var(--t3); margin-right:10px; text-transform:uppercase; letter-spacing:.08em}
  .memlet-mn{font-size:14.5px; color:var(--text); line-height:1.55; margin:8px 0}
  .memlet-row{font-size:13px; color:var(--t2); margin-top:6px} .memlet-row b{color:var(--gold-b)} .memlet-row .ar{font-family:var(--ar); font-size:17px; color:var(--arab)}
  /* Membean-style memlet */
  .memlet-wrap .mlsec{border:1px solid rgba(255,255,255,.08); background:#0f0f0f; padding:13px 15px; margin-bottom:10px; box-shadow:4px 4px 0 rgba(0,0,0,.35)}
  .memlet-wrap .mlsec .h{font-family:var(--serif); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--gold-d); margin-bottom:10px}
  .ml-top{display:flex; align-items:center; gap:15px; margin-bottom:12px}
  .ml-root{font-family:var(--ar); font-size:44px; color:var(--gold-b); line-height:1}
  .ml-pron{font-family:var(--serif); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--t3)}
  .ml-core{font-size:14px; color:var(--text); margin-top:3px}
  .ml-img{margin-left:auto; font-size:40px}
  .ingr-row{display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap}
  .ingr-chip{display:inline-flex; flex-direction:column; align-items:center; border:1px solid var(--bd); background:#161616; padding:6px 14px; min-width:78px}
  .ingr-chip .ar{font-family:var(--ar); font-size:20px; color:var(--gold-b)}
  .ingr-chip .tag{font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--t3); margin-top:2px}
  .ingr-row .arrow{color:var(--gold-d); font-weight:700; font-size:16px}
  .ingr-mean{font-size:13.5px; color:var(--t2)}
  .ingr-syn{margin-top:8px; padding-top:9px; border-top:1px dashed rgba(201,168,76,.2); font-size:14px; color:var(--text)}
  .ingr-syn .ar{font-family:var(--ar); font-size:19px; color:var(--gold-b); margin-left:4px}
  .sarf{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px}
  .sarfc{border:1px solid rgba(255,255,255,.07); background:#141414; padding:8px 11px; direction:rtl; text-align:right}
  .sarfc .sl{font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:.04em; unicode-bidi:plaintext} .sarfc .sl .ar{font-family:var(--ar); font-size:13px; color:var(--t2); text-transform:none}
  .sarfc .sv{font-family:var(--ar); font-size:20px; color:var(--gold-b); margin-top:3px}
  .hook{display:flex; gap:14px; align-items:center}
  .hook .hk-art{width:58px; height:58px; flex:0 0 auto; border:1px solid var(--bd); display:flex; align-items:center; justify-content:center; font-size:30px; background:#0c0c0c}
  .hook .hk-mn{font-size:14px; color:var(--text); line-height:1.5}
  .exlist .ex{font-size:14px; color:var(--t2); padding:6px 0; border-top:1px solid rgba(255,255,255,.05)}
  .exlist .ex:first-child{border-top:0}
  .exlist .ex .ar{font-family:var(--ar); font-size:19px; color:var(--arab); margin-left:4px} .exlist .ex .ex-t{color:var(--t3); font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  .mlsec .h .src{font-family:-apple-system,system-ui,sans-serif; font-size:8.5px; letter-spacing:.05em; text-transform:none; color:var(--t3); margin-left:8px; opacity:.8; font-weight:600}
  .qforms{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:7px}
  .qform{display:flex; align-items:baseline; gap:8px; border:1px solid rgba(255,255,255,.07); border-inline-start:2px solid var(--gold-d); padding:7px 11px; background:#141414; direction:rtl}
  .qform .qf-w{font-family:var(--ar); font-size:20px; color:var(--gold-b); line-height:1}
  .qform .qf-p{font-family:var(--ar); font-size:14px; color:var(--morph); opacity:.85}
  .qform .qf-c{font-size:11px; color:var(--t3); font-weight:700; white-space:nowrap; margin-inline-start:auto; direction:ltr}
  .senses{display:flex; flex-direction:column; gap:8px}
  .sense{border:1px solid rgba(255,255,255,.07); border-left:2px solid rgba(255,255,255,.12); padding:9px 12px; background:#141414; position:relative}
  .sense.core{border-left-color:var(--gold)}
  .sense .core-tag{position:absolute; top:9px; right:11px; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--bg); background:var(--gold); padding:1px 7px; font-weight:800}
  .sense .s-ar{font-family:var(--ar); font-size:19px; color:var(--arab); direction:rtl; text-align:right; line-height:1.7}
  .sense .s-en{font-size:13px; color:var(--t2); margin-top:4px; line-height:1.5}
  .sense .s-key{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-d); font-weight:800; margin-bottom:3px; direction:ltr; text-align:left}
  /* ═══════ ROOT INFORMATION MEMLET · presentation layer ═══════ */
  .rinfo{display:flex; flex-direction:column}
  .ri-note{border:1px solid var(--bd); border-left:3px solid var(--gold-d); background:#111; padding:11px 14px; margin-bottom:12px; font-size:12.5px; color:var(--t2); line-height:1.55}
  /* HERO — entry point; states the conclusion first (Pyramid Principle) */
  .ri-hero{border:1px solid var(--bd-hi); background:radial-gradient(130% 150% at 100% 0,rgba(201,168,76,.11),transparent 55%),linear-gradient(180deg,#141210,#0b0b0b); padding:22px 24px; box-shadow:6px 6px 0 rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05); position:relative}
  .ri-radicals{display:flex; align-items:center; gap:9px; justify-content:flex-end; direction:rtl}
  .ri-radicals .rad{font-family:var(--ar); font-size:42px; color:var(--gold-b); line-height:1; text-shadow:0 2px 14px rgba(201,168,76,.28)}
  .ri-radicals .rad-dot{color:var(--gold-d); font-size:22px}
  .ri-head{font-family:var(--serif); font-size:clamp(15px,2.1vw,19px); color:var(--gold-b); margin-top:13px; line-height:1.42; letter-spacing:.01em}
  .ri-core{margin-top:12px; padding-top:11px; border-top:1px solid rgba(201,168,76,.18); display:flex; flex-direction:column; gap:4px}
  .ri-core .ar{font-family:var(--ar); font-size:21px; color:var(--arab); direction:rtl; text-align:right; line-height:1.5}
  .ri-core-en{font-size:12.5px; color:var(--t2); font-style:italic; line-height:1.5}
  /* ACT divider — segments the arc (SCR/DIA), sets reading rhythm */
  .ri-act{display:flex; align-items:center; gap:12px; margin:30px 0 14px}
  .ri-act::after{content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--gold-d),transparent)}
  .act-k{font-family:var(--serif); font-size:11px; letter-spacing:.18em; color:var(--bg); background:var(--gold); padding:3px 11px; font-weight:700}
  .act-t{font-family:var(--serif); font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--gold-d); white-space:nowrap}
  /* SECTION card — Gestalt grouping + breathing room */
  .ri-sec{border:1px solid rgba(255,255,255,.07); border-left:2px solid var(--gold-d); background:#0e0e0e; padding:16px 18px 17px; margin-bottom:12px; box-shadow:4px 4px 0 rgba(0,0,0,.32)}
  .ri-sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.06)}
  .ri-sec-t{font-family:var(--serif); font-size:13.5px; letter-spacing:.02em; color:var(--gold-b); line-height:1.3}
  .ri-story{font-size:13.5px; color:var(--text); line-height:1.72} .ri-story .ar{font-family:var(--ar); color:var(--arab)}
  .ri-foot{margin-top:12px; padding-top:9px; border-top:1px dashed rgba(201,168,76,.16)}
  .ri-anchor{font-size:10.5px; color:var(--t3); font-style:italic; letter-spacing:.03em}
  /* POLES as a spectrum axis — a continuum, not two boxes (shape the data) */
  .ri-axis{display:flex; align-items:flex-start; margin-bottom:15px}
  .ax-pole{display:flex; flex-direction:column; gap:3px; flex:0 0 auto} .ax-pole.r{text-align:right; align-items:flex-end}

const ARLET='ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
function _shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function _pick(arr,n){const p=arr.slice(),o=[];while(o.length<n&&p.length){o.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);}return o;}
function _scramble(root){const arr=[...root];if(arr.length>=2&&Math.random()<0.5){const i=Math.floor(Math.random()*arr.length);let j=Math.floor(Math.random()*arr.length);while(j===i)j=Math.floor(Math.random()*arr.length);[arr[i],arr[j]]=[arr[j],arr[i]];}else{const i=Math.floor(Math.random()*arr.length);let c=ARLET[Math.floor(Math.random()*ARLET.length)];while(c===arr[i])c=ARLET[Math.floor(Math.random()*ARLET.length)];arr[i]=c;}return arr.join('');}
function genQuiz(a,type){

  if(type==='meaning'){q=`What does <span class="ar">${a}</span> convey?`;const ds=_pick(allR,2).map(r=>({t:ROOT_HOOKS[r],ok:0}));opts=_shuf([{t:core,ok:1},...ds]);}

  else if(type==='pattern'){q=`In <span class="ar">${I.word}</span>, the pattern <span class="ar">${I.patt}</span> adds:`;const others=Object.values(INGREDIENTS).map(x=>x.pattM).filter(p=>p!==I.pattM);const ds=_pick(others,2).map(d=>({t:d,ok:0}));opts=_shuf([{t:I.pattM,ok:1},...ds]);}
  else if(type==='usage'){q=`In the passage, <span class="ar">${I.word}</span> means:`;const ds=_pick(allR,2).map(r=>({t:ROOT_HOOKS[r],ok:0}));opts=_shuf([{t:I.wordM,ok:1},...ds]);}

/* FAMILY QUIZ — generated across the root's real D1 data: senses · attested forms · verb government · constellation.
   (D1 also holds a curated bank in ar_ling_question_items — currently seeded for نذر.) */
function familyQuizHTML(root){
  const G=GOVERNMENT[root], QF=QURAN_FORMS[root]||[], R=ROOT_INFO[root];
  const senses = R ? R.senses.rows.map(r=>({core:r[0],en:r[2]})) : (LEX_SENSES[root]||[]).map(r=>({core:r[0],en:r[1]}));
  const idioms=EXPR_IDIOMS[root]||[], lexS=LEX_SENSES[root]||[];
  const types=[];
  if(G&&G.rows.length) types.push('gov');
  if(QF.length>=3) types.push('freq');
  if(senses.length>=3) types.push('sense');
  if(R&&R.constellation) types.push('constel');
  if(idioms.length) types.push('idiom');       // build from D1 verbal idioms
  if(lexS.length) types.push('lexicon');        // build from D1 lexicon senses
  if(!types.length) return quizHTML(root);
  const type=types[Math.floor(Math.random()*types.length)];
  let q,opts,tag;
  if(type==='gov'){ tag='government';
    const row=_pick(G.rows,1)[0], correct=(TR_LABEL[row[2]]||TR_LABEL.intransitive)[0];
    const pool=['لازم','متعدٍّ','ذو وجهين','بمفعولين','مبني للمجهول'].filter(x=>x!==correct);
    opts=_shuf([{t:correct,ok:1,ar:1},..._pick(pool,2).map(t=>({t,ok:0,ar:1}))]);
    q=`Form ${row[0]} · <span class="ar">${row[1]}</span> — its government is:`;
  } else if(type==='freq'){ tag='forms';
    const sorted=[...QF].sort((x,y)=>y[2]-x[2]), top=sorted[0];
    opts=_shuf([{t:top[0],ok:1,ar:1},..._pick(sorted.slice(1),2).map(d=>({t:d[0],ok:0,ar:1}))]);
    q=`Which form of <span class="ar">${root}</span> occurs most in the Qurʾān?`;
  } else if(type==='sense'){ tag='senses';
    const core=senses.find(s=>s.core)||senses[0], others=senses.filter(s=>s!==core);
    opts=_shuf([{t:core.en,ok:1},..._pick(others,2).map(s=>({t:s.en,ok:0}))]);
    q=`Which is the <b>core</b> sense of <span class="ar">${root}</span>?`;
  } else if(type==='constel'){ tag='constellation';
    const fam=R.constellation.family.concat(R.constellation.near_syn), near=_pick(fam,1)[0];
    const opp=R.related?R.related.pair[1]:'—', other=_pick(ROOTS.map(r=>r[0]).filter(r=>r!==root),1)[0];
    opts=_shuf([{t:near,ok:1,ar:1},{t:opp,ok:0,ar:1},{t:other,ok:0,ar:1}]);
    q=`Which word belongs to the <span class="ar">${root}</span> constellation?`;
  } else if(type==='idiom'){ tag='verbal idiom';
    const it=_pick(idioms,1)[0];
    const pool=Object.keys(EXPR_IDIOMS).filter(r=>r!==root).flatMap(r=>EXPR_IDIOMS[r]).map(x=>x.en);
    opts=_shuf([{t:it.en,ok:1},..._pick(pool,2).map(t=>({t,ok:0}))]);
    q=`The verbal idiom <span class="ar">${it.x}</span> (${it.occ}× in the Qurʾān) means:`;
  } else { tag='lexicon';
    const s=_pick(lexS,1)[0];
    const pool=Object.keys(LEX_SENSES).filter(r=>r!==root).flatMap(r=>LEX_SENSES[r]).map(x=>x[1]);

  let s=`<svg class="constel" viewBox="0 0 380 300">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="120" fill="none" stroke="rgba(255,255,255,.05)"/><circle cx="${cx}" cy="${cy}" r="72" fill="rgba(201,168,76,.05)" stroke="rgba(255,255,255,.05)"/>`;
  near.forEach((n,i)=>{const ang=Math.PI*(0.72+ (i/(near.length-1||1))*(0.86-0.14) - 0.72)-Math.PI; const a2=Math.PI+(-0.7)+ (i/(Math.max(1,near.length-1)))*(1.4); const x=cx+Math.cos(a2)*120, y=cy+Math.sin(a2)*95 - 40;
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(77,217,168,.4)"/><circle cx="${x}" cy="${y}" r="4" fill="#4dd9a8"/><text x="${x}" y="${y-9}" fill="#cfe8dd" font-size="13" text-anchor="middle" font-family="'Amiri',serif">${n[0]}</text>`;});
  opp.forEach((n,i)=>{const a2=(-0.5)+ (i/(Math.max(1,opp.length-1)))*(1.0); const x=cx+Math.cos(a2)*120, y=cy+Math.sin(a2)*90 + 55;

  return s;
}

  return `<div class="rinfo">
    <div class="ri-hero">
      <div class="ri-radicals">${R.radicals.map(x=>`<span class="rad ar">${x}</span>`).join('<span class="rad-dot">·</span>')}</div>
      <div class="ri-head">${D.headline}</div>
      <div class="ri-core"><span class="ar">${D.core_ar}</span><span class="ri-core-en">${D.core}</span></div>
    </div>

    ${act('I','What the root fundamentally is')}
    ${sec('Root DNA','ar_ling_root_dna', `${poleAxis}<p class="ri-story">${D.story}</p>`)}
    ${sec('Sense axes — the DNA, scored','ar_ling_root_sense_axes', axHTML)}

    ${act('II','How the one idea fans into senses')}
    ${sec('Unique senses','ar_ling_syn_sense', senseHTML)}
    ${sec('Root image — the etymon','ar_ling_memlets · root_image', `<p class="ri-story">${R.root_image.body}</p><footer class="ri-foot"><span class="ri-anchor">anchor · ${R.root_image.anchor}</span></footer>`)}
    ${sec('The contronym','ar_ling_memlets · related', `<p class="ri-story">${R.related.body}</p><div class="ri-pair"><span class="rchip"><span class="ar">${R.related.pair[0]}</span></span><span class="pole-x">↔</span><span class="rchip oppo"><span class="ar">${R.related.pair[1]}</span></span>${R.related.addad?'<span class="addad-tag">أضداد</span>':''}</div><footer class="ri-foot"><span class="ri-anchor">${R.related.dispute}</span></footer>`)}

    ${act('III','Its reach across the language')}
    ${sec(`Form families — ${R.variants.count} lemmas · ${R.variants.forms.length} forms`,'ar_ling_memlets · variants', ffHTML)}
    ${govHTML?sec('Verb government — transitivity & how it is reached','ar_ling_verb_government', govHTML):''}
    ${sec('Constellation — the web of clarity','ar_ling_memlets · constellation', `<p class="ri-story">${R.constellation.body}</p>${famHTML}<footer class="ri-foot"><span class="ri-anchor">authority · ${R.constellation.authority}</span></footer>`)}
    ${sec('Examples — range across senses','ar_ling_memlets · examples', `<div class="ri-exlist">${exHTML}</div><div class="ri-poetry">‟ ${R.examples.poetry} ”</div>`)}
    ${sec(`Attestation — ${R.attestation.count} witnesses`,'ar_ling_memlets · attestation', `<p class="ri-story">${R.attestation.body}</p><div class="ri-sources">${R.attestation.sources.map(s=>`<span class="wtag">${s}</span>`).join('')}</div>`)}
  </div>`;
}
function renderMorph(){const el=document.querySelector('#morphView'); if(!el) return; el.innerHTML = morphRoot ? renderRootDetail() : VIEWS[morphState.e][morphState.m]();}
let readingTk=true;
function renderReading(){const el=document.querySelector('#mushafView'); if(!el) return;
  const src = readingTk ? AYAT_FULL.map(a=>[a[0],a[1]]) : AYAT_BARE;
  const AN='٠١٢٣٤٥٦٧٨٩', num=n=>String(n).split('').map(d=>AN[+d]).join('');
  el.innerHTML = `<div class="mushafpage">` + src.map(([n,ar])=>`${ar} <span class="ayamark">${num(n)}</span>`).join(' ') + `</div>`;
}

/* render all pages — each its own box, no outer container */
app.innerHTML = homeHTML() + STAGES.map((s,i)=>stageHTML(s,i)).join('');
renderMorph(); renderReading();

/* router — real page switch, no modals */
function go(key,back){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active','back'));
  const el=$('#page-'+key); el.classList.add('active'); if(back) el.classList.add('back');
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]'); if(t){ go(t.dataset.go, t.dataset.back==='1'); return; }
  const op=e.target.closest('.quiz .opt'); if(op){ const box=op.closest('.opts'); if(!box.classList.contains('answered')){ box.classList.add('answered'); box.querySelectorAll('.opt').forEach(o=>{ if(o.dataset.ok==='1') o.classList.add('right'); }); if(op.dataset.ok!=='1'&&!op.classList.contains('unsure')){ op.classList.add('wrong'); const w=WORD_INFO[morphRoot]; WRONG_LOG.push({word:w?w.word:morphRoot, root:morphRoot, q:box.previousElementSibling?box.previousElementSibling.textContent:'', picked:op.textContent.trim(), t:Date.now()}); const wb=document.querySelector('#wrongBar'); if(wb) wb.innerHTML=wrongBarHTML(); } } return; }
  const nq=e.target.closest('[data-newq]'); if(nq){ const box=document.querySelector('#quizBox'); if(box&&morphRoot) box.innerHTML=quizHTML(morphRoot); return; }
  const fq=e.target.closest('[data-fq]'); if(fq){ const box=document.querySelector('#famQuizBox'); if(box&&morphRoot) box.innerHTML=familyQuizHTML(morphRoot); return; }
  const tile=e.target.closest('.spell .tile'); if(tile && !tile.disabled){ const sp=tile.closest('.spell'), slots=[...sp.querySelectorAll('.slot')], empty=slots.find(s=>!s.textContent); if(empty){ empty.textContent=tile.dataset.l; tile.disabled=true; tile.classList.add('used'); if(slots.every(s=>s.textContent)){ const ok=slots.map(s=>s.textContent).join('')===sp.dataset.answer; sp.classList.add(ok?'right':'wrong'); sp.querySelector('.spell-msg').textContent=ok?'✓ correct — say it aloud':'✗ not quite — clear and retry'; } } return; }
  const clr=e.target.closest('.spell [data-clear]'); if(clr){ const sp=clr.closest('.spell'); sp.classList.remove('right','wrong'); sp.querySelectorAll('.slot').forEach(s=>s.textContent=''); sp.querySelectorAll('.tile').forEach(tt=>{tt.disabled=false;tt.classList.remove('used');}); sp.querySelector('.spell-msg').textContent=''; return; }
  const rc=e.target.closest('[data-root]'); if(rc){ morphRoot=rc.dataset.root; morphWord=rc.dataset.word||null; morphRootTab=(rc.dataset.tab==='memlet'||morphState.m==='memlets')?'memlet':'info'; renderMorph(); return; }
  const rb=e.target.closest('[data-rootback]'); if(rb){ morphRoot=null; morphWord=null; renderMorph(); return; }
  const rt=e.target.closest('[data-rt]'); if(rt){ morphRootTab=rt.dataset.rt; renderMorph(); return; }
  const be=e.target.closest('[data-e]'); if(be){ morphRoot=null; morphWord=null; morphState.e=be.dataset.e; be.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===be));
    const mm=document.querySelector('#mmMemlets'); if(mm){ if(morphState.e==='expr'){ mm.style.display='none'; morphState.m='info'; document.querySelectorAll('#morphMode button').forEach(x=>x.classList.toggle('on',x.dataset.m==='info')); } else mm.style.display=''; }
    renderMorph(); return; }
  const bm=e.target.closest('[data-m]'); if(bm){ morphState.m=bm.dataset.m; if(morphRoot)morphRootTab=bm.dataset.m==='memlets'?'memlet':'info'; else morphWord=null; bm.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===bm)); renderMorph(); return; }
  const tk=e.target.closest('[data-tk]'); if(tk){ readingTk=tk.dataset.tk==='on'; tk.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===tk)); renderReading(); return; }
});
</script>
